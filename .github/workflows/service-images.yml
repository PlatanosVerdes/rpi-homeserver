name: Service images

# Builds the images compose builds from services/, publishes them to GHCR and pins the new tags in
# versions.env. That commit is what deploys them, like "Deploy app" does for the apps' own repos.
# A pull request builds the same images and never pushes or commits. See docs/service-images.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Pending runs on main collapse into the newest, which is enough: each plan compares against what
# versions.env pins, not against the previous push.
concurrency:
  group: service-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      due: ${{ steps.plan.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Pi's compose, the same one ports.yml uses.
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.0.2
      - run: sed 's/^TAILSCALE_IP=.*/TAILSCALE_IP=100.64.0.1/' .env.example > .env
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            args=(--base "$BASE")
          fi
          echo "due=$(python3 scripts/ci/service-images.py plan "${args[@]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.due != '[]'
    name: build ${{ matrix.service }}
    # Native arm64, the Pi's architecture, so nothing runs under QEMU emulation.
    runs-on: ubuntu-24.04-arm
    # A fork's pull request gets a read-only token whatever this says, and only main logs in or pushes.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.due) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.ref == 'refs/heads/main' && matrix.image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        if: github.ref == 'refs/heads/main' && matrix.image != ''
        env:
          REF: ${{ matrix.image }}:${{ matrix.tag }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::notice::$REF is already published and tags are never overwritten; not building it again"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && matrix.image != '' }}
          tags: ${{ matrix.image != '' && format('{0}:{1}', matrix.image, matrix.tag) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.commit }}
          # Off, as on the Pi: an attestation would turn the pushed tag into an index for nothing.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  pin:
    needs: [plan, build]
    # always(): one service failing to build must not hold back the ones that did.
    if: always() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.plan.outputs.due != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with "Deploy app", the other workflow that commits to versions.env.
    concurrency:
      group: versions-env
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - env:
          DUE: ${{ needs.plan.outputs.due }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          msg="$RUNNER_TEMP/deploy-message"
          for attempt in 1 2 3 4 5; do
            # From scratch on every attempt: a rebase could keep a pin another run has since moved.
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -f "$msg"
            status=0
            python3 scripts/ci/service-images.py pin --message "$msg" <<<"$DUE" || status=$?
            (( status == 0 || status == 3 )) || exit "$status"
            [[ -s "$msg" ]] || exit "$status"
            git commit -q -F "$msg" -- versions.env
            if git push -q origin HEAD:main; then
              cat "$msg"
              exit "$status"
            fi
            echo "main moved while pinning, retrying ($attempt/5)"
            sleep $((attempt * 3))
          done
          exit 1
