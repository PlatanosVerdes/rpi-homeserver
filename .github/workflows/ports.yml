name: Host ports

# Fails a PR that has two containers claiming the same host port, in this repo or against
# rpi-services, which runs on the same Pi. The job summary lists every port in use.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlatanosVerdes/rpi-services
          path: rpi-services
      # The Pi's compose: the runner's older one rejects the modules each declaring media-network.
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1
      # The example's TAILSCALE_IP is a placeholder compose rejects as an address.
      - run: sed 's/^TAILSCALE_IP=.*/TAILSCALE_IP=100.64.0.1/' .env.example > .env
      - run: python3 scripts/ci/ports.py . rpi-services
