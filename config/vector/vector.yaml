# Ships every container's stdout/stderr to VictoriaLogs.
#
# docker_logs reads the socket read-only, only to enumerate containers and follow them. `docker
# logs` keeps working: the json-file driver is untouched.

data_dir: /vector-data

sources:
  containers:
    type: docker_logs
    # Vector's own output would loop straight back into itself
    exclude_containers:
      - vector

  # The cron scripts append to files in the repo root instead of printing to a container, so
  # docker_logs cannot see them. read_from: beginning imports the existing history once, and Vector
  # checkpoints in /vector-data so a restart resumes. One directory per repo under /host-logs, and
  # the stream name is the file's basename: two repos must not own a log with the same name.
  cron_logs:
    type: file
    include:
      - /host-logs/*/*.log
    read_from: beginning

transforms:
  # VictoriaLogs indexes by stream fields, so keep them low-cardinality: container name and stream
  # (stdout/stderr) are enough to slice by. The image tag would churn a new stream on every bump.
  # File events carry no container, so they would land with an empty stream field and clump into
  # one unqueryable stream. Naming them after the log file lets `container:apply` work exactly like
  # `container:caddy`, and stream:file separates the two kinds when that matters.
  shaped_files:
    type: remap
    inputs: [cron_logs]
    source: |
      .container = replace(string!(.file), r'^.*/(.+)\.log$', "$$1")
      .stream = "file"
      del(.host)
      del(.source_type)

  shaped:
    type: remap
    inputs: [containers]
    source: |
      .container = del(.container_name)

      # `docker compose run --rm` names its container <project>-<service>-run-<random hex>, a
      # different one every invocation, so the nightly One Pace job was opening a new stream each
      # night and container:one-pace-downloader matched none of them. Strip the suffix and every
      # run lands in one stream.
      .container = replace(string!(.container), r'-run-[0-9a-f]{12}$', "")

      # A bare `docker run` with no --name gets docker's adjective_surname generator, which is a
      # new stream per throwaway container: 100 of the 135 streams here came from those, carrying
      # 1% of the lines between them. The lines are worth keeping, the streams are not, so they
      # share one. No service on this host has an underscore in its name, so nothing real collides.
      if match(string!(.container), r'^[a-z]+_[a-z]+$') {
        .container = "adhoc"
      }
      del(.container_created_at)
      del(.container_id)
      del(.image)
      del(.label)
      del(.source_type)

      # A service that already logs JSON (laliga-fantasy does) arrives as one escaped string,
      # so its own fields are invisible to LogsQL: you can grep the line but you cannot ask
      # for level:ERROR or msg:"world moved". Parsing it here lifts those fields to the top
      # level, and leaves the human sentence in .message so a plain-text reader still works.
      # Containers that log text fail the parse and are untouched.
      parsed, parse_error = parse_json(.message)
      if parse_error == null && is_object(parsed) {
        fields = object!(parsed)
        if exists(fields.msg) {
          .message = string!(fields.msg)
          del(fields.msg)
        }
        # The sink stamps _time itself; a second timestamp field only adds noise.
        del(fields.time)
        . = merge(., fields)
      }

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [shaped, shaped_files]
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    request:
      headers:
        VL-Time-Field: timestamp
        VL-Msg-Field: message
        VL-Stream-Fields: container,stream
