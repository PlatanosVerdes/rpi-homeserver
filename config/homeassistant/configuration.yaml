# Mounted read-only over /config/configuration.yaml. What the UI creates (integrations,
# automations, scripts, scenes, users) lives in appdata/homeassistant and is backed up with it.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# No `http:` here: HA reads it once into .storage/http and ignores it after that. The reverse proxy
# is set in the UI, see docs/home-assistant.md.

# appdata is on the SD card: commit every 30 s instead of every 5 s, and keep ten days.
recorder:
  commit_interval: 30
  purge_keep_days: 10
