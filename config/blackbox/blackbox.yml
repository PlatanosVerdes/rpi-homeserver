# Blackbox probes for services with no exporter of their own.
#
# The point here is liveness, not authentication: Plex, Jellyfin, the *arrs and qBittorrent all
# answer 401/302/403 to an unauthenticated request, and that is a perfectly good "I am alive".
# Treating those as failures would make the module useless, so they count as success.
modules:
  http_alive:
    prober: http
    timeout: 8s
    http:
      # 307/308 are here because Seerr answers 307 to /: any redirect still proves it is up.
      # 303 and 404 for the same reason: Tautulli redirects / with a 303 and cross-seed answers 404
      # to it, and only a server that is running answers either. The probes hit containers
      # directly, never through Caddy, so no proxy can answer 404 on a dead app's behalf.
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308, 401, 403, 404]
      valid_http_versions: [HTTP/1.0, HTTP/1.1, HTTP/2.0]
      follow_redirects: false
      preferred_ip_protocol: ip4
