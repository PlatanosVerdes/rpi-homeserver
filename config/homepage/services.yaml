- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:8096
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_TOKEN}}"
          enableNowPlaying: true

- Monitoring:
    - Grafana:
        icon: grafana.png
        href: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:3000
        server: my-docker
        container: grafana

    - Prometheus:
        icon: prometheus.png
        href: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:9090
        server: my-docker
        container: prometheus
        widget:
            type: prometheus
            url: http://prometheus:9090

    - Pushgateway:
        icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/prometheus.png
        href: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:9091
        server: my-docker
        container: pushgateway

- Management:
    - Network:
        icon: https://img.icons8.com/?size=100&id=12995&format=png&color=000000
        href: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:8443
        widget:
            type: speedtest
            url: http://speedtest-tracker:80
            key: "{{HOMEPAGE_VAR_SPEEDTEST_TOKEN}}"
            bitratePrecision: 1