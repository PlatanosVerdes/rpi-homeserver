# The order of the groups BELOW IS IGNORED: homepage lays the page out in the order the
# `layout:` block of settings.yaml lists them. Change that file to move a group.
#
# Groups are named after what you came here to do, not after a software category. The old
# "Indexers" group held Radarr, Sonarr, Bazarr and FlareSolverr, none of which is an indexer,
# so nobody looking for Radarr would have opened it. Order is by what actually gets used.

- Watch:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.platanosverdes.com
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://host.docker.internal:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_TOKEN}}"
          enableNowPlaying: true
    - Plex:
        icon: plex.svg
        href: http://{{HOMEPAGE_VAR_STATIC_IP}}:32400/web
        server: my-docker
        container: plex
        widget:
          type: plex
          url: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}" #https://www.plexopedia.com/plex-media-server/general/plex-token/
    - Seerr:
        icon: seerr.svg
        href: https://seerr.platanosverdes.com
        server: my-docker
        container: seerr
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_TOKEN}}"

- Library:
    - Radarr:
        icon: radarr.svg
        href: https://radarr.platanosverdes.com
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_TOKEN}}"
    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.platanosverdes.com
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_TOKEN}}"
    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.platanosverdes.com
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_TOKEN}}"

- Homegrown:
    - SubDown:
        icon: https://subs.platanosverdes.com/icon.svg
        href: https://subs.platanosverdes.com
        description: Subtitles by language, movie by movie
        server: my-docker
        container: subtitle-links
    - Farnsworth:
        icon: https://farnsworth.platanosverdes.com/icon.svg
        href: https://farnsworth.platanosverdes.com
        description: Acestream channels in your player
        server: my-docker
        container: farnsworth
    - Baird:
        icon: https://baird.platanosverdes.com/icon.svg
        href: https://baird.platanosverdes.com
        description: Acestream channels picked from pages and the engine
        server: my-docker
        container: baird
    - bifrost:
        icon: https://bifrost.platanosverdes.com/favicon.svg
        href: https://bifrost.platanosverdes.com
        description: Acestream channels, their state and what is playing
        server: my-docker
        container: bifrost
    - sleipnir:
        icon: https://sleipnir.platanosverdes.com/icon.svg
        href: https://sleipnir.platanosverdes.com
        description: VPN tunnels, where each one exits, and moving them
        server: my-docker
        container: sleipnir
    - muninn:
        icon: https://muninn.platanosverdes.com/icon.svg
        href: https://muninn.platanosverdes.com
        description: Who uses each bot, and how much traffic reaches it
        server: my-docker
        container: muninn
    - Torrent drop:
        icon: https://drop.platanosverdes.com/icon.svg
        href: https://drop.platanosverdes.com
        description: Drop a .torrent, cross-seed follows on its own
        server: my-docker
        container: torrent-drop
    - Audio convert:
        icon: https://audio.platanosverdes.com/icon.svg
        href: https://audio.platanosverdes.com
        description: Files a TV had re-encoded, and the button that fixes them
        server: my-docker
        container: audio-convert
    - torre:
        icon: https://torre.platanosverdes.com/icon.svg
        href: https://torre.platanosverdes.com
        description: AENA departures and arrivals, with flight alerts
        server: my-docker
        container: torre
    - Apex:
        icon: https://apex.platanosverdes.com/icon.svg
        href: https://apex.platanosverdes.com
        description: Motorcycle routes for Google Maps
        server: my-docker
        container: apex

- Monitoring:
    - Grafana:
        icon: grafana.svg
        href: https://grafana.platanosverdes.com
        server: my-docker
        container: grafana
    - VictoriaLogs:
        icon: victoriametrics.svg
        href: https://logs.platanosverdes.com/select/vmui/
        server: my-docker
        container: victorialogs

- Downloads:
    - Bazarr:
        icon: bazarr.svg
        href: https://bazarr.platanosverdes.com
        description: Subtitle downloader
        server: my-docker
        container: bazarr
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://torrent.platanosverdes.com
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: admin
          password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
    - FlareSolverr:
        icon: flaresolverr.svg
        server: my-docker
        container: flaresolverr
    - autobrr:
        icon: autobrr.svg
        href: https://autobrr.platanosverdes.com
        description: Grabs freeleech off the tracker's IRC announce
        server: my-docker
        container: autobrr
        widget:
          type: autobrr
          url: http://autobrr:7474
          key: "{{HOMEPAGE_VAR_AUTOBRR_KEY}}"
    - qbit-manage:
        icon: qbittorrent.svg
        description: Tags torrents by tracker and hardlink state
        server: my-docker
        container: qbit-manage
    - Maintainerr:
        icon: maintainerr.svg
        href: https://maintainerr.platanosverdes.com
        server: my-docker
        container: maintainerr
    - Tautulli:
        icon: tautulli.svg
        href: https://tautulli.platanosverdes.com
        server: my-docker
        container: tautulli
        widget:
          type: tautulli
          url: http://tautulli:8181
          key: "{{HOMEPAGE_VAR_TAUTULLI_TOKEN}}"

- Network:
    - Pi-hole:
        icon: pi-hole.svg
        href: https://pihole.platanosverdes.com/admin
        server: my-docker
        container: pihole
        widget:
          type: pihole
          url: http://host.docker.internal:8081
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
    - Speedtest:
        icon: https://img.icons8.com/?size=100&id=12995&format=png&color=000000
        href: https://speedtest.platanosverdes.com
        server: my-docker
        container: speedtest-tracker
        widget:
            type: speedtest
            url: http://speedtest-tracker:80
            key: "{{HOMEPAGE_VAR_SPEEDTEST_TOKEN}}"
            bitratePrecision: 1

- Services:
    - Offers Bot:
        icon: telegram.svg
        description: Pol Academy Offers Hunter
        server: my-docker
        container: pol-academy-offers-bot
    - Fantasy:
        icon: https://fantasy.platanosverdes.com/assets/favicon.png
        href: https://fantasy.platanosverdes.com
        server: my-docker
        container: laliga-fantasy
        # /healthz answers 503 when the last refresh failed or the session is dying, so the
        # dot on the card is the real state and not just "the container is up".
        siteMonitor: http://laliga-fantasy:8000/healthz

- Internals:
    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.platanosverdes.com
        server: my-docker
        container: prometheus
        widget:
            type: prometheus
            url: http://prometheus:9090
    - Pushgateway:
        icon: prometheus.svg
        href: https://push.platanosverdes.com
        server: my-docker
        container: pushgateway

# The second node. Its own homepage is gone: everything it serves is linked from here, through this
# node's Caddy over Tailscale. No container status, since that would need its Docker socket.
- streamhalla:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.streamhalla.platanosverdes.com
        description: The TV's Jellyfin, on streamhalla
    - bifrost:
        icon: https://bifrost.platanosverdes.com/favicon.svg
        href: https://bifrost.streamhalla.platanosverdes.com
        description: streamhalla's Acestream channels
    - Grafana:
        icon: grafana.svg
        href: https://grafana.platanosverdes.com/d/acestream-monitor?var-datasource=prometheus-streamhalla
        description: Its Acestream dashboard, on this Grafana
    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.streamhalla.platanosverdes.com
