# The order of the groups BELOW IS IGNORED: homepage lays the page out in the order the
# `layout:` block of settings.yaml lists them. Change that file to move a group.
#
# Groups are named after what you came here to do, not after a software category, and ordered by
# how often that is: watching first, administration last. A card with nothing to open
# (FlareSolverr, qbit-manage, a bot) is left out.

- Watch:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://host.docker.internal:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_TOKEN}}"
          enableNowPlaying: true
    - Plex:
        icon: plex.svg
        href: http://{{HOMEPAGE_VAR_STATIC_IP}}:32400/web
        server: my-docker
        container: plex
        widget:
          type: plex
          url: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}" #https://www.plexopedia.com/plex-media-server/general/plex-token/
    - Seerr:
        icon: seerr.svg
        href: https://seerr.{{HOMEPAGE_VAR_DOMAIN}}
        server: my-docker
        container: seerr
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_TOKEN}}"

- Live TV:
    - bifrost:
        icon: https://bifrost.{{HOMEPAGE_VAR_DOMAIN}}/favicon.svg
        href: https://bifrost.{{HOMEPAGE_VAR_DOMAIN}}
        description: Acestream channels, their state and what is playing
        server: my-docker
