        server: my-docker
        container: audio-convert

- System:
    - Grafana:
        icon: grafana.svg
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
        server: my-docker
        container: grafana
    - VictoriaLogs:
        icon: victoriametrics.svg
        href: https://logs.{{HOMEPAGE_VAR_DOMAIN}}/select/vmui/
        server: my-docker
        container: victorialogs
    - Pi-hole:
        icon: pi-hole.svg
        href: https://pihole.{{HOMEPAGE_VAR_DOMAIN}}/admin
        server: my-docker
        container: pihole
        widget:
          type: pihole
          url: http://host.docker.internal:8081
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
    - Speedtest:
        icon: https://img.icons8.com/?size=100&id=12995&format=png&color=000000
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}/d/speedtest/speedtest
        server: my-docker
        container: speedtest
        widget:
            type: prometheusmetric
            url: http://prometheus:9090
            refreshInterval: 300000
            metrics:
              - label: Download
                query: speedtest_download_bits_per_second
                format:
                  type: bitrate
              - label: Upload
                query: speedtest_upload_bits_per_second
                format:
                  type: bitrate
              - label: Ping
                query: speedtest_ping_ms
                format:
                  type: number
                  suffix: " ms"
    - sleipnir:
        icon: https://sleipnir.{{HOMEPAGE_VAR_DOMAIN}}/icon.svg
        href: https://sleipnir.{{HOMEPAGE_VAR_DOMAIN}}
        description: VPN tunnels, where each one exits, and moving them
        server: my-docker
        container: sleipnir
    - Tautulli:
        icon: tautulli.svg
        href: https://tautulli.{{HOMEPAGE_VAR_DOMAIN}}
        server: my-docker
        container: tautulli
        widget:
          type: tautulli
          url: http://tautulli:8181
          key: "{{HOMEPAGE_VAR_TAUTULLI_TOKEN}}"
    - muninn:
        icon: https://muninn.{{HOMEPAGE_VAR_DOMAIN}}/icon.svg
        href: https://muninn.{{HOMEPAGE_VAR_DOMAIN}}
        description: Who uses each bot, and how much traffic reaches it
        server: my-docker
        container: muninn
    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.{{HOMEPAGE_VAR_DOMAIN}}
        server: my-docker
        container: prometheus
        widget:
            type: prometheus
            url: http://prometheus:9090

# The second node. Its own homepage is gone: everything it serves is linked from here, through this
# node's Caddy over Tailscale. No container status, since that would need its Docker socket.
- streamhalla:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.streamhalla.{{HOMEPAGE_VAR_DOMAIN}}
        description: The TV's Jellyfin, on streamhalla
    - bifrost:
        icon: https://bifrost.{{HOMEPAGE_VAR_DOMAIN}}/favicon.svg
        href: https://bifrost.streamhalla.{{HOMEPAGE_VAR_DOMAIN}}
        description: streamhalla's Acestream channels
    - Grafana:
        icon: grafana.svg
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}/d/acestream-monitor?var-datasource=prometheus-streamhalla
        description: Its Acestream dashboard, on this Grafana
    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.streamhalla.{{HOMEPAGE_VAR_DOMAIN}}
