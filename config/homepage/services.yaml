- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://torrent.{{HOMEPAGE_VAR_DOMAIN}}
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: admin
          password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
    - autobrr:
        icon: autobrr.svg
        href: https://autobrr.{{HOMEPAGE_VAR_DOMAIN}}
        description: Grabs freeleech off the tracker's IRC announce
        server: my-docker
        container: autobrr
        widget:
          type: autobrr
          url: http://autobrr:7474
          key: "{{HOMEPAGE_VAR_AUTOBRR_KEY}}"
    - Torrent drop:
        icon: https://drop.{{HOMEPAGE_VAR_DOMAIN}}/icon.svg
        href: https://drop.{{HOMEPAGE_VAR_DOMAIN}}
        description: Drop a .torrent, cross-seed follows on its own
        server: my-docker
        container: torrent-drop
    - SubDown:
        icon: https://subs.{{HOMEPAGE_VAR_DOMAIN}}/icon.svg
        href: https://subs.{{HOMEPAGE_VAR_DOMAIN}}
