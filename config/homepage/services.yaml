- Apps:
    - Fantasy:
        icon: https://fantasy.{{HOMEPAGE_VAR_DOMAIN}}/assets/favicon.png
        href: https://fantasy.{{HOMEPAGE_VAR_DOMAIN}}
        server: my-docker
        container: laliga-fantasy
        # /healthz answers 503 when the last refresh failed or the session is dying, so the
        # dot on the card is the real state and not just "the container is up".
        siteMonitor: http://laliga-fantasy:8000/healthz
    - torre:
        icon: https://torre.{{HOMEPAGE_VAR_DOMAIN}}/icon.svg
        href: https://torre.{{HOMEPAGE_VAR_DOMAIN}}
        description: AENA departures and arrivals, with flight alerts
        server: my-docker
        container: torre
    - Apex:
        icon: https://apex.{{HOMEPAGE_VAR_DOMAIN}}/icon.svg
