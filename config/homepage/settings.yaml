# https://gethomepage.dev/configs/settings/

title: "RaspiHome"
favicon: https://img.icons8.com/?size=100&id=12229&format=png&color=000000
base: https://raspi.{{HOMEPAGE_VAR_DOMAIN}}

#background:
#  image: https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop
#  opacity: 0.5
quicklaunch:
  searchDescriptions: true    
  hideInternetSearch: false   
  showSearchSuggestions: true
  hideVisitURL: false         
  provider: duckduckgo

statusStyle: dot              
# Stats on demand (click a card's dot): each one is a docker stats call, 2-4 s on the Pi, times 25 cards.
showStats: false
hideVersion: true            
disableUpdateCheck: false

# THIS is what orders the page: Homepage takes the group order from here, not from services.yaml,
# and puts four groups to a row. Every group is listed so they all share one style; `style` only
# takes `row` or `column`, an unknown value is silently ignored along with its `columns`.
layout:
  Watch:
    style: column
  Live TV:
    style: column
  Apps:
    style: column
  Library:
    style: column
  Downloads:
    style: column
  System:
    style: column
  streamhalla:
    style: column

appearance:
  fontFamily: "Inter"
  fontWeight: 500
  useEqualHeightCards: true # From the new docs you provided