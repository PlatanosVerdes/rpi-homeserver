# https://gethomepage.dev/configs/settings/

title: "RaspiHome"
favicon: https://img.icons8.com/?size=100&id=12229&format=png&color=000000
base: https://raspi.platanosverdes.com

#background:
#  image: https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop
#  opacity: 0.5
quicklaunch:
  searchDescriptions: true    
  hideInternetSearch: false   
  showSearchSuggestions: true
  hideVisitURL: false         
  provider: google            

statusStyle: dot              
showStats: true               
hideVersion: true            
disableUpdateCheck: false

# Every group is listed, or the ones left out fall back to a different style and the columns
# stop lining up between rows. Column counts follow how many services each group holds.
layout:
  Watch:
    style: grid
    columns: 3
  Library:
    style: grid
    columns: 3
  Subtitles:
    style: grid
    columns: 2
  Downloads:
    style: grid
    columns: 4
  Monitoring:
    style: grid
    columns: 2
  Network:
    style: grid
    columns: 2
  Automation:
    style: grid
    columns: 2
  Internals:
    style: grid
    columns: 2

appearance:
  fontFamily: "Inter"
  fontWeight: 500
  useEqualHeightCards: true # From the new docs you provided