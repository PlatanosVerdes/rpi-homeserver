apiVersion: 1

# Alert rules, provisioned from git (read-only in the UI on purpose: this file is the source
# of truth). Every expression is written to return 1 when it fires, using PromQL's `bool`
# modifier, so all rules share the same "threshold > 0" condition and stay easy to read.
#
# What is NOT covered here, by design: the Pi being dead. Grafana dies with it, so that one
# needs the external dead man's switch (see docs/alerting.md).
#
# execErrState is KeepLast everywhere and never Error: with Error, a query that merely fails to run
# raises a labelless DatasourceError, so restarting Prometheus pages you about a healthy service.
# The trade is that a permanently broken expression stays quiet, so check
# `docker logs grafana | grep provision` after editing this file.

groups:
  - orgId: 1
    name: homelab
    folder: Alerts
    interval: 1m
    rules:
      - uid: homelab-disk-root
        title: System disk almost full
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Less than 15% free on / (the SD card)
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < bool 0.15'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-disk-data
        title: Data disk almost full
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Less than 10% free on the data disk
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(node_filesystem_avail_bytes{mountpoint="/mnt/data"} / node_filesystem_size_bytes{mountpoint="/mnt/data"}) < bool 0.10'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-backup-failed
        title: Backup failed
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The last appdata backup reported an error
          description: Check backup.log on the Pi. Metric backup_last_status is not 0.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'backup_last_status != bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-backup-stale
        title: No recent backup
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No successful backup in more than 36 hours
          description: The daily 04:00 cron either did not run or never finished.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - backup_last_run_timestamp) > bool 129600'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-deploy-error
        title: Deploy failing
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The last deploy ended in error
          description: Check apply.log. Most likely a failed build or a compose error.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'deploy_last_status == bool 2'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-target-down
        title: Prometheus target down
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          # Annotations are rendered per alert instance, so the variables are $labels/$values.
          # `range .Alerts` only exists in the notification template, not here.
          # Name the target, not just the job: the job is named after the thing being monitored
          # (pihole) while what actually failed is its exporter (pihole-exporter:9666).
          summary: 'Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }})'
          description: >-
            That metrics endpoint is unreachable. The service it monitors may well be fine: this
            fires on the exporter, not on the app behind it.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'up == bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-temp-high
        title: Pi running hot
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SoC temperature above 75 C for 10 minutes
          description: Sustained throttling territory. Check airflow and heavy containers.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'node_thermal_zone_temp > bool 75'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-acestream-sources-all-failing
        title: 'Acestream, every source URL failing'
        condition: C
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'No Acestream source URL is reachable, the channel list cannot be updated'
          description: >-
            Every IPFS gateway in the list is erroring, so the .m3u Jellyfin reads will go stale.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'count(acestream_source_http_code != 200) == bool count(acestream_source_http_code)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-acestream-source-failing
        title: 'Acestream, a source URL failing'
        condition: C
        for: 30m
        labels:
          severity: warning
        annotations:
          # Per series, not a count: each failing gateway is its own alert instance, so the
          # message can name it while the others keep working.
          summary: 'Acestream source {{ $labels.url }} is failing'
          description: >-
            Degraded but still working as long as another gateway answers. IPFS gateways are flaky,
            hence the long wait before this fires.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'acestream_source_http_code != bool 200'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-ms-secret-expiring
        title: 'MS client secret expiring'
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'The Microsoft client secret expires in less than a week'
          description: >-
            Renew it in Azure and update rpi-services/.env. Exact days left are on the Home dashboard.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(ms_client_secret_days_remaining < bool 7) * (ms_client_secret_days_remaining > bool 0)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-ms-secret-expired
        title: 'MS client secret expired'
        condition: C
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'The Microsoft client secret has expired'
          description: >-
            cal-bridge can no longer authenticate against Microsoft, so its calendar API is dead until renewed.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'ms_client_secret_days_remaining <= bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-backup-grew
        title: 'Backup archive grew sharply'
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'The last backup is over 50% larger than the weekly average'
          description: >-
            Something new is being archived. Look for a cache or database that slipped into appdata and belongs in the exclude list.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'backup_last_size_bytes > bool (avg_over_time(backup_last_size_bytes[7d]) * 1.5)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-container-restart-loop
        title: 'Container restart loop'
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} has restarted more than twice in an hour'
          description: >-
            Something is crashing on startup. docker logs on that container is the place to look.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'changes(container_start_time_seconds{name!=""}[1h]) > bool 2'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-memory-low
        title: 'Memory almost exhausted'
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Less than 10% of RAM available'
          description: >-
            Below this the Pi starts swapping to the SD card and everything crawls. Usually a container leaking or a transcode.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < bool 10'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-acestream-stale
        title: 'Acestream updater not running'
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'The Acestream updater has not run in over an hour'
          description: >-
            The source URLs can still answer 200 while the updater is stuck, so this is the rule that catches a frozen container: without it the channel list silently goes stale.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - acestream_last_run_timestamp) > bool 3600'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-onepace-failures
        title: 'One Pace downloads failing'
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'The last One Pace run left failed episodes'
          description: >-
            Stays firing until a later run reports zero failures, since the metric holds its last value between daily runs.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'onepace_episodes_failed > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      # A collector can be stuck while the process is alive, and up == 0 would say nothing about
      # that. The interval is exported next to the timestamp so this needs no threshold per
      # collector: four missed passes is late whatever its schedule is.
      - uid: homelab-metrics-collector-overdue
        title: 'A pi-metrics collector is overdue'
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.collector }} has not produced a snapshot in four of its intervals'
          description: >-
            The panels fed by this collector are showing the last snapshot it managed, which is not
            the same as nothing: they look normal and are stale. The service itself is up, or the
            "exporter down" rule would have fired instead.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - pi_metrics_last_success_timestamp_seconds) > bool (4 * pi_metrics_collection_interval_seconds)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The loop can wedge while the process is alive, and up == 0 would say nothing about that.
      # Same shape as the pi-metrics rule: the interval travels next to the timestamp, so four
      # missed passes is late without a threshold written here.
      - uid: homelab-tracker-control-overdue
        title: 'tracker-control is overdue'
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'The tracker loop has not finished a pass in four of its intervals'
          description: >-
            Nothing is reading the account or moving the freeleech filter and the grab rate, so the
            arrs may be taking paid torrents on a ratio nobody is watching. The panels keep showing
            the last reading, which is why this is a separate alert from the service being down.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - tracker_control_loop_timestamp_seconds) > bool (4 * tracker_control_loop_interval_seconds)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-service-not-answering
        title: 'Service not answering'
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          # instance is rewritten to the probed URL in prometheus.yml, so this names the service
          summary: '{{ $labels.instance }} is not responding'
          description: >-
            The blackbox probe got no valid answer. Unlike the container-level rules this one means
            the app itself is not serving, even if its container is up.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'probe_success == bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-qbit-torrent-error
        title: 'Torrents in error'
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'qBittorrent has torrents in error or with missing files'
          description: >-
            Those will never finish or seed on their own. missingFiles usually means the data was
            moved or deleted underneath qBittorrent.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'sum(qbittorrent_torrents_count{status=~"error|missingFiles"}) > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-qbit-stalled-download
        title: 'Download stalled for hours'
        condition: C
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} has been stalled with no peers for 6 hours'
          description: >-
            Long stalled downloads rarely recover. Worth a manual look, or letting Radarr blocklist
            the release and try another one.
        noDataState: OK
        execErrState: KeepLast
        data:
          # No aggregation on purpose: qbit_torrent_progress carries a `name` label per torrent
          # (services/pi-metrics), so each stalled torrent becomes its OWN alert instance with its
          # own `for` timer, instead of one nameless blob that also mis-resets when a different
          # torrent starts stalling while another one is already being counted.
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'qbit_torrent_progress{state="stalledDL"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [-1] }
      - uid: homelab-torrent-announce-silent
        title: 'A torrent is seeding to nobody'
        condition: C
        # 30m, because `rem_unregistered` runs hourly and deletes a disowned torrent on its next
        # pass: at 2h the alert matured after the thing it describes had gone. A tracker between
        # announces does not trip it, since "no working tracker" persists rather than flickering.
        #
        # This is the reason every share-limit group carries a margin: qBittorrent counts seeding
        # time while announces are rejected and the site does not, so a goal met here can still owe
        # hours there. See docs/lifecycle.md.
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} has no working tracker'
          description: >-
            It is seeding locally and the tracker is not accepting the announce, so the site is
            crediting none of it while qBittorrent keeps counting. Usually a reset passkey, an
            account suspended, or the site being blocked from here. Until it clears, that torrent's
            seeding time is fiction. If the tracker has disowned it outright, qbit-manage removes it
            on its next hourly pass and the data waits 7 days in the recycle bin.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'qbit_torrent_no_working_tracker > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-tracker-warned-and-under
        title: 'A tracker warning is about to be re-checked'
        condition: C
        # Not "a warning exists": TorrentLeech has had one open for days with the ratio at 1.336
        # against a line of 0.4, and a message a day about something already fixed is how an alert
        # gets ignored. This is the case that needs a person: the re-check lands within two days and
        # the account is still under the line, which is the moment it gets disabled.
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.tracker }} re-checks its warning within two days, still under its line'
          description: >-
            The site gave a deadline and it is nearly here. Freeleech is the only download that does
            not make this worse, and upload is the only thing that fixes it. What the site asks and
            what is configured against it is on the Private trackers dashboard.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(tracker_warning_seconds < 172800) and on(tracker) ((tracker_ratio or tracker_read_ratio) / tracker_min_ratio < 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-tracker-reading-stale
        title: 'An account has not been read in a week'
        condition: C
        # DigitalCore answers 403 on every user endpoint and C411's definition is API-key only with
        # no login, so those two are read by eye into config/trackers/readings.json. A stale reading
        # is not a gap on a panel: every headroom and every decision downstream is computed from it,
        # so it keeps deciding with last week's numbers and looks perfectly healthy doing it.
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.tracker }} was last read more than a week ago'
          description: >-
            Open the site, read ratio, uploaded, downloaded and points off its profile, and put them
            in config/trackers/readings.json with today's date. The Reading age panel on the Private
            trackers dashboard is the same number this fired on.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - tracker_read_timestamp) > bool 604800'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-torrent-unmanaged
        title: 'A torrent nothing will ever clean up'
        condition: C
        # An hour, not minutes: a torrent added by hand and categorised a moment later is not a
        # problem, and autobrr's own grabs arrive tagged. What this catches is the one that stays
        # bare, which costs nothing today and a disk full in a year.
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} is in no retention group'
          description: >-
            It has no category, so qbit-manage can never mark it as unlinked, and no `ratio` tag, so
            no share-limits group matches it either. It will seed until someone notices. Give it a
            category the nohardlinks list covers, or the `ratio` tag if it is a ratio grab that was
            never in the library.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'qbit_torrent_unmanaged > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-indexers-all-down
        title: 'Every indexer is down'
        condition: C
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Prowlarr has every enabled indexer disabled after failures'
          description: >-
            Nothing can be searched or grabbed at all until at least one recovers.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'sum(prowlarr_indexer_up{enabled="true"}) == bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-used-indexer-down
        title: 'An indexer is down'
        condition: C
        # 6h, not minutes: an indexer being down is not fixable from here, so the only version worth
        # a message is "gone long enough to pick a different one". With the 1h average in the
        # expression that is ~7h of being mostly down, and the average is also what stops a recovery
        # blip resolving the alert and re-firing it.
        #
        # Every enabled indexer, one alert each, including a private tracker with zero grabs: an
        # account still in its newbie window has none by definition and is exactly the one worth
        # hearing about. Disabling the indexer in Prowlarr is what silences it.
        #
        # scripts/ops/indexer-retry.py clears the backoff within 15 min of the site answering, so
        # this no longer fires over a site that recovered. It still fires over one reachable only
        # through a proxy or FlareSolverr, which that script cannot probe. See docs/alerting.md.
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: 'Indexer {{ $labels.name }} is down'
          description: >-
            Failing most of its checks for the last hour, so searches are going out without it. The
            backoff is cleared within 15 minutes of the site answering again, so this still being up
            means the site is genuinely unreachable from here. Several at once is the line, not the
            trackers: check the certificate before touching an account.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'avg_over_time(prowlarr_indexer_up{enabled="true"}[1h]) < bool 0.5'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-indexer-failing-queries
        title: 'An indexer is failing its searches'
        condition: C
        # Separate from "is down" on purpose: Prowlarr only disables an indexer after repeated
        # failures, so between the first failed search and that point an indexer reads as up while
        # returning nothing. On a private tracker that gap is usually an expired session or a reset
        # passkey, which is worth knowing on the day it happens rather than six hours later.
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Indexer {{ $labels.name }} failed searches in the last hour'
          description: >-
            The indexer is still enabled and still answering, so the availability timeline shows it
            green, but searches sent to it are coming back as failures. Check the indexer in
            Prowlarr: for a private tracker this is usually credentials, a reset passkey or the
            site being behind a challenge Flaresolverr is not clearing.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'increase(prowlarr_indexer_failed_queries_total[1h]) > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-seed-cleanup-failed
        isPaused: true           # Paused on 2026-08-24: the script is parked, so it cannot report a status.
        title: Seed cleanup failed
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The seed-aware torrent cleanup reported an error
          description: >-
            Nothing is lost when this fails, it just stops giving disk back: watched films keep
            seeding and pile up. Check `container:seed-cleanup` in VictoriaLogs, or run
            `DRY_RUN=1 scripts/trackers/seed-cleanup.py` on the Pi to see what it would do.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'seed_cleanup_last_status != bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-seed-cleanup-stale
        isPaused: true           # Paused on 2026-08-24: the script is parked on purpose, so of course it is stale.
        title: Seed cleanup not running
        condition: C
        # It runs hourly, so three hours means two missed passes: cron, the script, or qBittorrent.
        # A silent stop is the failure mode that matters here, because the symptom is a disk that
        # fills over weeks with nothing in the logs to explain it.
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No seed cleanup pass in more than 3 hours
          description: The hourly cron either did not run or never finished.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - seed_cleanup_last_run_timestamp) > bool 10800'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-arr-orphan-queue
        title: 'Download nothing can import'
        condition: C
        # Two hours, because a download that just finished can legitimately sit in the queue for a
        # few minutes while the *arr decides what to do with it.
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} cannot import {{ $labels.title }}'
          description: >-
            Reason given: {{ $labels.reason }}. This usually means the movie or series was deleted
            from the *arr while its download was still running, so the finished file has nothing to
            import into and waits for a human. Radarr only re-announces it when it restarts, which
            is why this rule exists. The torrent may still owe its tracker, so do not delete
            anything: take it out of the *arr's category in qBittorrent. Deleting the queue entry
            alone does not stick, the *arr rebuilds its queue from the download client.
        noDataState: OK
        execErrState: KeepLast
        data:
          # No aggregation on purpose, same reason as the stalled download above: arr_orphan_queue_bytes
          # carries title and app labels, so each stuck item gets its own alert and its own timer.
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'arr_orphan_queue_bytes'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [-1] }

      - uid: homelab-orphan-data
        title: 'Data in downloads that nothing owns'
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Bytes in downloads that no torrent claims and the library does not share
          description: >-
            scripts/trackers/seed-cleanup.py only ever looks at torrents that exist, so data left behind by a torrent
            that was removed without its files is reclaimed by nobody. While the library still
            shares the file this stays quiet on purpose (it wastes nothing); it starts firing the
            day the retention policy deletes the film and those bytes become unreachable.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'arr_orphan_data_total_bytes{linked="no"} > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-tracker-headroom
        title: 'Almost no paid downloads left'
        condition: C
        # Headroom is what fits above the ratio the site disables the account at, so this is the
        # number that decides whether the *arrs may take a torrent that is not freeleech. Below
        # 10 GB a single film can cross the line, and crossing it is a warning with a seven-day
        # clock, not a nudge.
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.tracker }}: under 10 GB of non-freeleech downloads still fit'
          description: >-
            buffer = uploaded - min_ratio x downloaded, and headroom is that buffer divided by
            min_ratio. tracker-control should already have switched the *arrs to freeleech only;
            if it has not, its own log says why.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'tracker_headroom_bytes < bool 10737418240'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-tracker-below-line
        title: 'Ratio under the line the tracker disables at'
        condition: C
        # Not a warning about a trend: at this point the site either has issued its warning or is
        # about to, and the only way back is upload or freeleech. Fires fast on purpose.
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.tracker }}: ratio is below its minimum'
          description: >-
            The account is on the wrong side of the line. Everything not freeleech must stop, and
            what is already seeding has to finish. See docs/private-trackers.md.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(tracker_ratio < tracker_min_ratio) > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-tracker-hnr-stopped
        title: 'A hit and run obligation with the clock stopped'
        condition: C
        # The site counts seeding time from announces, so a torrent that owes hours and is paused,
        # errored or missing its files is not paying anything off. Three uncleared obligations is
        # a disabled account on TorrentLeech, and the fix is free while the torrent still exists.
        #
        # 5m, not 30m, because of DigitalCore: its FAQ says one hour without an announce is enough
        # to be listed, and the reading itself is only refreshed every 30 minutes, so the alert has
        # to add as little delay as possible on top of that.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.tracker }}: a torrent owes seeding hours and is not seeding'
          description: >-
            Resume it, fix its files, or expect the obligation to stay open. tracker_hnr_torrent_
            hours_left names the torrents and how many hours each still owes.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'tracker_hnr_at_risk > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-tracker-stats-stale
        title: 'Tracker numbers not being read'
        condition: C
        # Everything above, and the control loop that acts on it, is blind without this. A stopped
        # scrape looks exactly like a healthy account, which is the worst way to fail.
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No tracker reading in over 2 hours
          description: >-
            tracker-control runs every 30 minutes. Either cron stopped, the site changed its login,
            or the stored session cookie no longer works and the password in Prowlarr is stale.
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - tracker_last_run_timestamp) > bool 7200'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
