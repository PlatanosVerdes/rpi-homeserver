apiVersion: 1

# Alert rules, provisioned from git (read-only in the UI on purpose: this file is the source
# of truth). Every expression is written to return 1 when it fires, using PromQL's `bool`
# modifier, so all rules share the same "threshold > 0" condition and stay easy to read.
#
# What is NOT covered here, by design: the Pi being dead. Grafana dies with it, so that one
# needs the external dead man's switch (see docs/alerting.md).

groups:
  - orgId: 1
    name: homelab
    folder: Alerts
    interval: 1m
    rules:
      - uid: homelab-disk-root
        title: System disk almost full
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Less than 15% free on / (the SD card)
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < bool 0.15'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-disk-data
        title: Data disk almost full
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Less than 10% free on the data disk
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(node_filesystem_avail_bytes{mountpoint="/mnt/data"} / node_filesystem_size_bytes{mountpoint="/mnt/data"}) < bool 0.10'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-backup-failed
        title: Backup failed
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The last appdata backup reported an error
          description: Check backup.log on the Pi. Metric backup_last_status is not 0.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'backup_last_status != bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-backup-stale
        title: No recent backup
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No successful backup in more than 36 hours
          description: The daily 04:00 cron either did not run or never finished.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - backup_last_run_timestamp) > bool 129600'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-deploy-error
        title: Deploy failing
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The last deploy ended in error
          description: Check apply.log. Most likely a failed build or a compose error.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'deploy_last_status == bool 2'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-target-down
        title: Prometheus target down
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          # Annotations are rendered per alert instance, so the variables are $labels/$values.
          # `range .Alerts` only exists in the notification template, not here.
          # Name the target, not just the job: the job is named after the thing being monitored
          # (pihole) while what actually failed is its exporter (pihole-exporter:9666).
          summary: 'Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }})'
          description: >-
            That metrics endpoint is unreachable. The service it monitors may well be fine: this
            fires on the exporter, not on the app behind it.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'up == bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-temp-high
        title: Pi running hot
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SoC temperature above 75 C for 10 minutes
          description: Sustained throttling territory. Check airflow and heavy containers.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'node_thermal_zone_temp > bool 75'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-acestream-sources-all-failing
        title: 'Acestream, every source URL failing'
        condition: C
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'No Acestream source URL is reachable, the channel list cannot be updated'
          description: >-
            Every IPFS gateway in the list is erroring, so the .m3u Jellyfin reads will go stale.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'count(acestream_source_http_code != 200) == bool count(acestream_source_http_code)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-acestream-source-failing
        title: 'Acestream, a source URL failing'
        condition: C
        for: 30m
        labels:
          severity: warning
        annotations:
          # Per series, not a count: each failing gateway is its own alert instance, so the
          # message can name it while the others keep working.
          summary: 'Acestream source {{ $labels.url }} is failing'
          description: >-
            Degraded but still working as long as another gateway answers. IPFS gateways are flaky,
            hence the long wait before this fires.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'acestream_source_http_code != bool 200'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-ms-secret-expiring
        title: 'MS client secret expiring'
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'The Microsoft client secret expires in less than a week'
          description: >-
            Renew it in Azure and update rpi-services/.env. Exact days left are on the Home dashboard.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(ms_client_secret_days_remaining < bool 7) * (ms_client_secret_days_remaining > bool 0)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-ms-secret-expired
        title: 'MS client secret expired'
        condition: C
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'The Microsoft client secret has expired'
          description: >-
            cal-bridge can no longer authenticate against Microsoft, so its calendar API is dead until renewed.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'ms_client_secret_days_remaining <= bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-backup-grew
        title: 'Backup archive grew sharply'
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'The last backup is over 50% larger than the weekly average'
          description: >-
            Something new is being archived. Look for a cache or database that slipped into appdata and belongs in the exclude list.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'backup_last_size_bytes > bool (avg_over_time(backup_last_size_bytes[7d]) * 1.5)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-container-restart-loop
        title: 'Container restart loop'
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} has restarted more than twice in an hour'
          description: >-
            Something is crashing on startup. docker logs on that container is the place to look.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'changes(container_start_time_seconds{name!=""}[1h]) > bool 2'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-memory-low
        title: 'Memory almost exhausted'
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Less than 10% of RAM available'
          description: >-
            Below this the Pi starts swapping to the SD card and everything crawls. Usually a container leaking or a transcode.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < bool 10'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-acestream-stale
        title: 'Acestream updater not running'
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'The Acestream updater has not run in over an hour'
          description: >-
            The source URLs can still answer 200 while the updater is stuck, so this is the rule that catches a frozen container: without it the channel list silently goes stale.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '(time() - acestream_last_run_timestamp) > bool 3600'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: homelab-onepace-failures
        title: 'One Pace downloads failing'
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'The last One Pace run left failed episodes'
          description: >-
            Stays firing until a later run reports zero failures, since the metric holds its last value between daily runs.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'onepace_episodes_failed > bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: homelab-service-not-answering
        title: 'Service not answering'
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          # instance is rewritten to the probed URL in prometheus.yml, so this names the service
          summary: '{{ $labels.instance }} is not responding'
          description: >-
            The blackbox probe got no valid answer. Unlike the container-level rules this one means
            the app itself is not serving, even if its container is up.
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'probe_success == bool 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

