apiVersion: 1

# Everything goes to the Telegram bot. repeat_interval keeps a still-broken thing from
# pinging every group_interval forever.
#
# Warnings re-notify on a much slower clock than criticals. The thing that made this necessary was a
# dead indexer: it is genuinely down for days, the alert is correct, and there is nothing to do about
# it from here, so a 6h reminder is pure noise four times a day. Criticals keep 6h because those are
# things you are expected to go and fix.
policies:
  - orgId: 1
    receiver: telegram-homelab
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 6h
    routes:
      - receiver: telegram-homelab
        object_matchers:
          - ['severity', '=', 'warning']
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
