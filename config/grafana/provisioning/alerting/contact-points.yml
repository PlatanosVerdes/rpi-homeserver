apiVersion: 1

# Telegram bot dedicated to homelab alerts. The token and chat id come from the environment
# (set in .env, passed to the container in compose-mon.yml) so they never land in git.
# Grafana interpolates $VAR in provisioning files.
contactPoints:
  - orgId: 1
    name: telegram-homelab
    receivers:
      - uid: telegram-homelab
        type: telegram
        disableResolveMessage: false
        settings:
          # Both MUST be quoted: Grafana wants strings, and an unquoted chat id is parsed as
          # a number, which fails provisioning and takes the whole Grafana startup down.
          bottoken: "$TELEGRAM_ALERT_BOT_TOKEN"
          chatid: "$TELEGRAM_ALERT_CHAT_ID"
          parse_mode: HTML
          message: |
            {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} <b>{{ .Status | toUpper }}</b>
            {{ range .Alerts }}
            <b>{{ .Labels.alertname }}</b>
            {{ .Annotations.summary }}
            {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
            {{ end }}
