# qbit_manage owns tagging and deletion since 2026-08-24. What each tag means and why every group
# asks for more seeding than its site does: docs/lifecycle.md.
commands:
  dry_run: false
  cat_update: false        # categories are Radarr's and Sonarr's business, not this tool's
  tag_update: true         # a tag per tracker, which is what share_limits groups filter on
  tag_tracker_error: true  # tags what a tracker no longer recognises, rather than removing it
  rem_unregistered: true   # on since 2026-08-24: it only removes what the tracker itself disowned
  tag_nohardlinks: true    # tags what the library no longer holds
  share_limits: true       # owns deletion since 2026-08-24, see PENDING.md
  rem_orphaned: false      # arr_orphan_* already watches this, and deleting is its own decision
  recheck: false
  skip_cleanup: false
  skip_qb_version_check: false

qbt:
  host: qbittorrent:8080
  user: !ENV QBIT_USER
  pass: !ENV QBIT_PASSWORD

settings:
  force_auto_tmm: false            # save paths are set by the *arrs, leave them alone
  tracker_error_tag: issue
  nohardlinks_tag: noHL
  private_tag: private

# Deleting moves files here instead of removing them. Without empty_after_x_days nothing ever
# clears it: the default is "keep forever".
recyclebin:
  enabled: true
  # 2 days, not 7: the bin lives under /mnt/data/downloads, so what it holds is still on the same
  # disk and the space does not come back until it empties. 76 GiB sat there on 2026-08-25 while
  # free space went down rather than up. Two days is long enough to notice a wrong deletion the
  # same evening and short enough that reclaimed disk is actually reclaimed.
  empty_after_x_days: 2

directory:
  # The same path qBittorrent reports, because hardlink counting compares the two views
  root_dir: /data/downloads
  remote_dir: /data/downloads
  recycle_bin: /data/downloads/.RecycleBin
  orphaned_dir: /data/downloads/orphaned_data

# Required as a list whenever tag_nohardlinks runs. Only radarr has torrents today; tv-sonarr is
# listed so the day it does, it is covered.
nohardlinks:
  - radarr
  - tv-sonarr

# Every category qBittorrent holds has to be listed or the run refuses to start
cat:
  radarr: /data/downloads
  tv-sonarr: /data/downloads
  prowlarr: /data/downloads

tracker:
  torrentleech:
    tag: torrentleech
  tleechreload:
    tag: torrentleech
  digitalcore:
    tag: digitalcore
  c411:
    tag: c411
  retrotoon:
    tag: retrotoon
  other:
    tag: other-tracker

# Lower priority wins, so a site with its own rule is evaluated before the generic private group.
# Two tags have to agree before a limit is written: include_all_tags is whose rules apply,
# include_any_tags is whether anything still needs the bytes. Share limits ignore hardlinks on
# their own, so without that second condition a torrent Plex is still playing would be deleted.
share_limits:
  torrentleech:
    priority: 1
    include_all_tags:
      - torrentleech
    include_any_tags:
      - noHL
      - ratio
    exclude_any_tags:            # the manual override: this is what makes a tag protect a torrent
      - keep
      - keep-bonus
    max_seeding_time: 15d          # 240 h asked, 120 h of margin for the clock gap
    max_ratio: 1.2
    min_last_active: 1d
    cleanup: true            # deletes into the recycle bin, kept 7 days
    resume_torrent_after_change: false

  # Its own group above `private` because retrotoon states no ratio rule at all: reaching 1:1 there
  # clears nothing, so a generic ratio limit would delete a torrent still owing time.
  retrotoon:
    priority: 2
    include_all_tags:
      - retrotoon
    include_any_tags:
      - noHL
      - ratio
    exclude_any_tags:            # the manual override: this is what makes a tag protect a torrent
      - keep
      - keep-bonus
    max_seeding_time: 120h         # 72 h asked, 48 h of margin
    max_ratio: -1            # -1 is "no ratio limit": time is the only thing that clears here
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # 96 h owed, not 72: their clock starts 24 h after the download and the client's at completion.
  c411:
    priority: 3
    include_all_tags:
      - c411
    include_any_tags:
      - noHL
      - ratio
    exclude_any_tags:            # the manual override: this is what makes a tag protect a torrent
      - keep
      - keep-bonus
    max_seeding_time: 150h
    max_ratio: 1.0
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # 120 h owed, 180 here. Their site is the only source of truth for seed time and it runs behind
  # the client's by 9 to 23 h, so this is nearly triple the worst gap seen.
  digitalcore:
    priority: 4
    include_all_tags:
      - digitalcore
    include_any_tags:
      - noHL
      - ratio
    exclude_any_tags:            # the manual override: this is what makes a tag protect a torrent
      - keep
      - keep-bonus
    max_seeding_time: 180h
    max_ratio: 1.0
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # The floor, so a new site is covered from its first torrent until it earns its own numbers.
  private:
    priority: 5
    include_all_tags:
      - private
    include_any_tags:
      - noHL
      - ratio
    exclude_any_tags:            # the manual override: this is what makes a tag protect a torrent
      - keep
      - keep-bonus
    max_seeding_time: 10d
    max_ratio: 1.0
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # "Public" is the absence of the private tag, not a tag of its own: qbit_manage only ever writes
  # private_tag. Selecting on a `public` tag matched nothing, so no public torrent had a limit.
  #
  # No noHL, no ratio and no min_last_active, deliberately: a public torrent is dropped even while
  # the library shares its file, because the point is leaving public swarms, not saving disk.
  public:
    priority: 6
    exclude_any_tags:
      - private
      - keep
      - keep-bonus
    # There is no "delete once hardlinked" rule here, so time is the closest equivalent: an import
    # takes minutes. min_seeding_time is absent because this tool refuses it unless max_ratio > 0.
    max_seeding_time: 2h
    max_ratio: -1
    cleanup: true
    resume_torrent_after_change: false

orphaned:
  empty_after_x_days: 7
  min_file_age_minutes: 60
  exclude_patterns:
    - "**/.RecycleBin/**"
    - "**/orphaned_data/**"
    - "**/incomplete/**"
    - "**/*.!qB"
    - "**/*.parts"
