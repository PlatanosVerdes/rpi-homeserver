# qbit_manage, running in DRY RUN alongside scripts/trackers/seed-cleanup.py until their decisions agree.
# See PENDING.md, "Adopt the standard tools and retire the bespoke script".
#
# Two things this is here to do that the bespoke script cannot: notice a torrent the tracker no
# longer recognises (a reset passkey went unnoticed for four days on 2026-08-16), and understand
# cross-seeds, which is a prerequisite for adding cross-seed at all.

# Evaluation phase: this writes TAGS and nothing else. Every command that deletes a torrent, or
# that writes a share limit into qBittorrent, is off. Tags are needed for real (dry_run skips them,
# and then the share_limits groups match nothing and report zeros, which is useless for comparing),
# and they are reversible in one click.
commands:
  dry_run: false
  cat_update: false        # categories are Radarr's and Sonarr's business, not this tool's
  tag_update: true         # a tag per tracker, which is what share_limits groups filter on
  tag_tracker_error: true  # tags what a tracker no longer recognises, rather than removing it
  rem_unregistered: false  # the feature that makes this tool worth adopting, but it deletes: later
  tag_nohardlinks: true    # tags what the library no longer holds
  share_limits: true       # owns deletion since 2026-08-24, see PENDING.md
  rem_orphaned: false      # arr_orphan_* already watches this, and deleting is its own decision
  recheck: false
  skip_cleanup: false
  skip_qb_version_check: false

qbt:
  host: qbittorrent:8080
  user: !ENV QBIT_USER
  pass: !ENV QBIT_PASSWORD

settings:
  force_auto_tmm: false            # save paths are set by the *arrs, leave them alone
  tracker_error_tag: issue
  nohardlinks_tag: noHL
  private_tag: private
  public_tag: public
  ignoreTags_OnUpdate:
    - noHL
    - issue
    - ratio
    - waiting-seed

directory:
  # The same path qBittorrent reports, because hardlink counting compares the two views
  root_dir: /data/downloads
  remote_dir: /data/downloads
  recycle_bin: /data/downloads/.RecycleBin
  orphaned_dir: /data/downloads/orphaned_data

# Required as a list whenever tag_nohardlinks runs. Only radarr has torrents today; tv-sonarr is
# listed so the day it does, it is covered.
nohardlinks:
  - radarr
  - tv-sonarr

# Every category qBittorrent holds has to be listed or the run refuses to start
cat:
  radarr: /data/downloads
  tv-sonarr: /data/downloads
  prowlarr: /data/downloads

tracker:
  torrentleech:
    tag: torrentleech
  tleechreload:
    tag: torrentleech
  digitalcore:
    tag: digitalcore
  c411:
    tag: c411
  retrotoon:
    tag: retrotoon
  other:
    tag: other-tracker

share_limits:
  # Lower priority number wins, so a tracker with its own rule is evaluated before the generic
  # private group. The numbers mirror config/qbittorrent/seed-rules.json on purpose, so the dry run
  # compares like with like.
  #
  # Two separate questions have to be answered before a limit is written, and each is a tag:
  #
  #   include_all_tags   which tracker it belongs to, so its rule applies and not another site's.
  #   include_any_tags   whether anything here still needs the bytes. Either the library has let go
  #                      of the file (noHL) or it was never in the library at all (ratio, which
  #                      autobrr puts on everything it grabs to build ratio). That second tag is
  #                      the only way those torrents are visible here: they carry no category, so
  #                      tag_nohardlinks never inspects them and they can never be tagged noHL.
  #
  # Share limits on their own ignore hardlinks, and the comparison run on 2026-08-21 caught exactly
  # that: two c411 torrents past ten days of seeding would have been removed while Plex still played
  # the same bytes. Seeding those costs no disk at all and earns ratio for free.
  #
  # min_last_active is the third condition, and the one that keeps a freeleech grab alive: a torrent
  # still moving bytes is still paying whatever its ratio says, and on a freeleech the download
  # never counted, so every byte up is profit. It is coarser than the 0.2 GB/day floor
  # scripts/trackers/seed-cleanup.py uses, because any activity at all resets it, so a torrent that
  # trickles is kept indefinitely. The free-space floor in config/trackers/rules.json is what stops
  # the grabber if that ever costs real disk.
  torrentleech:
    priority: 1
    include_all_tags:
      - torrentleech
    include_any_tags:
      - noHL
      - ratio
    # 360 h rather than the tracker's own 240 h, because qBittorrent's clock runs ahead of the
    # tracker's: it counts while announces are being rejected. Measured gap on 2026-08-21 across
    # 14 torrents: 26 to 118 hours. See config/qbittorrent/seed-rules.json for the full reasoning.
    max_seeding_time: 15d
    max_ratio: 1.2
    min_last_active: 1d
    cleanup: true            # deletes into the recycle bin, kept 7 days
    resume_torrent_after_change: false

  # Its own group, above `private`, for one reason: retrotoon's rules page states no ratio rule at
  # all, so reaching 1:1 clears nothing there and only the 72 h of seeding does. Left in the generic
  # group below, one of their torrents reaching ratio 1.0 early would be deleted still owing time,
  # which is a hit and run on the site that calls this its strictest rule with no exceptions.
  retrotoon:
    priority: 2
    include_all_tags:
      - retrotoon
    include_any_tags:
      - noHL
      - ratio
    # 120 h against the 72 h they ask, so 48 h of margin. The generic 10 d it sat under was 168 h
    # of margin on a site whose only rule is time, which is disk held for nothing.
    max_seeding_time: 120h
    max_ratio: -1            # -1 is "no ratio limit": time is the only thing that clears here
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # 96 h owed, not 72: their clock starts 24 h after the download and the client's starts at
  # completion, so 150 h here is 54 h of margin. Their H&R system is disabled site-wide right now,
  # which is the reason this one can afford a thinner margin than DigitalCore's.
  c411:
    priority: 3
    include_all_tags:
      - c411
    include_any_tags:
      - noHL
      - ratio
    max_seeding_time: 150h
    max_ratio: 1.0
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # 120 h owed, and left at 240 on purpose. Their FAQ is explicit that the site is the only source
  # of truth for seed time, because it counts only what it saw announced, so the client's counter
  # says nothing here. The gap between the two clocks has only ever been measured on TorrentLeech,
  # where it ran from 26 to 118 h. Measure it here on the site's own per-torrent seed time before
  # cutting this number, and then 180 h is the target.
  digitalcore:
    priority: 4
    include_all_tags:
      - digitalcore
    include_any_tags:
      - noHL
      - ratio
    max_seeding_time: 240h
    max_ratio: 1.0
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # Anything private with no group of its own, which today is nothing: every private tracker here
  # has one. It stays as the floor so a new site is covered from its first torrent, at the generic
  # goal, until it earns its own numbers.
  private:
    priority: 5
    include_all_tags:
      - private
    include_any_tags:
      - noHL
      - ratio
    max_seeding_time: 10d
    max_ratio: 1.0
    min_last_active: 1d
    cleanup: true
    resume_torrent_after_change: false

  # No noHL and no ratio here, deliberately: a public torrent is dropped even while the library
  # shares its file, because the point is getting this address out of public swarms rather than
  # saving disk. No min_last_active either, for the same reason: still being useful to a public
  # swarm is not a reason to stay in it.
  public:
    priority: 6
    include_any_tags:
      - public
    # The bespoke script drops a public torrent as soon as the library has the file, to get this
    # address out of public swarms. There is no "delete once hardlinked" rule here, so the closest
    # equivalent is time: an import takes minutes, so two hours is generous, and the library copy
    # survives because deleting the download side only removes one of the two names.
    # min_seeding_time is deliberately absent: this tool refuses it unless max_ratio is above 0.
    max_seeding_time: 2h
    max_ratio: -1
    cleanup: true
    resume_torrent_after_change: false

orphaned:
  empty_after_x_days: 7
  min_file_age_minutes: 60
  exclude_patterns:
    - "**/.RecycleBin/**"
    - "**/orphaned_data/**"
    - "**/incomplete/**"
    - "**/*.!qB"
    - "**/*.parts"
