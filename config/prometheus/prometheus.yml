global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']
    honor_labels: true

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'speedtest-tracker'
    static_configs:
      - targets: ['host.docker.internal:8443']
    metrics_path: '/prometheus'
    scheme: 'http'

  - job_name: 'pihole'
    static_configs:
      - targets: ['pihole-exporter:9666']

  # Cloudflare tunnel health (--metrics flag in compose-core.yml). Only up when the
  # `tunnel` profile is active, so it shows as down on a Pi without the tunnel.
  - job_name: 'cloudflared'
    static_configs:
      - targets: ['host.docker.internal:2000']

  # The numbers no exporter provides: which film was upgraded, which torrent is stalled, where the
  # disk went. It answers from a snapshot, so this scrape is milliseconds whatever it collects.
  - job_name: 'pi-metrics'
    static_configs:
      - targets: ['pi-metrics:9110']

  - job_name: 'tailscale'
    static_configs:
      - targets: ['tailscale-metrics:9736']

  - job_name: 'qbittorrent'
    static_configs:
      - targets: ['qbittorrent-exporter:17871']

  # The tracker economy: what each site says about the account, and what the knobs are set to.
  - job_name: 'tracker-control'
    static_configs:
      - targets: ['tracker-control:9111']

  # Liveness probes for services without an exporter (see config/blackbox/blackbox.yml).
  #
  # No list of targets on purpose: a container labelled `prometheus.probe` is probed at that URL, so
  # a service is monitored by the compose file that creates it, in either repo. The label holds the
  # whole URL because the fair answer differs per app, and because a container on the host network
  # has to be reached through the gateway rather than by name. See docs/add-service.md.
  #
  # The relabeling leaves `instance` as the probed URL and `service` as the container name, which is
  # what the dashboards and the alert rule read.
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_alive]
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_probe]
        regex: '(.+)'
        action: keep
      - source_labels: [__meta_docker_container_label_prometheus_probe]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.+)'
        target_label: service
        replacement: '${1}'
      - target_label: __address__
        replacement: blackbox-exporter:9115
