global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']
    honor_labels: true

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'speedtest-tracker'
    static_configs:
      - targets: ['host.docker.internal:8443']
    metrics_path: '/prometheus'
    scheme: 'http'

  - job_name: 'pihole'
    static_configs:
      - targets: ['pihole-exporter:9666']

  # Cloudflare tunnel health (--metrics flag in compose-core.yml). Only up when the
  # `tunnel` profile is active, so it shows as down on a Pi without the tunnel.
  - job_name: 'cloudflared'
    static_configs:
      - targets: ['host.docker.internal:2000']

  # Uncomment when tailscale-exporter is enabled in compose-mon.yml
  # - job_name: 'tailscale'
  #   static_configs:
  #     - targets: ['tailscale-exporter:9736']

  # Liveness probes for services without an exporter (see config/blackbox/blackbox.yml).
  # The relabeling makes `instance` the probed service, so an alert says "jellyfin", not
  # "blackbox-exporter:9115".
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_alive]
    static_configs:
      - targets:
          - http://jellyfin:8096/health
          - http://host.docker.internal:32400/identity
          - http://radarr:7878/
          - http://sonarr:8989/
          - http://prowlarr:9696/
          - http://bazarr:6767/
          - http://overseerr:5055/
          - http://qbittorrent:8080/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
