global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']
    honor_labels: true

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'speedtest-tracker'
    static_configs:
      - targets: ['host.docker.internal:8443']
    metrics_path: '/prometheus'
    scheme: 'http'

  - job_name: 'pihole'
    static_configs:
      - targets: ['pihole-exporter:9666']

  # Cloudflare tunnel health (--metrics flag in compose-core.yml). Only up when the
  # `tunnel` profile is active, so it shows as down on a Pi without the tunnel.
  - job_name: 'cloudflared'
    static_configs:
      - targets: ['host.docker.internal:2000']

  - job_name: 'tailscale'
    static_configs:
      - targets: ['tailscale-metrics:9736']

  - job_name: 'qbittorrent'
    static_configs:
      - targets: ['qbittorrent-exporter:17871']

  # Liveness probes for services without an exporter (see config/blackbox/blackbox.yml).
  #
  # There is no list of targets here on purpose. Docker is asked instead: a container carrying the
  # label `prometheus.probe` is probed at that URL, so a service is monitored by the compose file
  # that creates it and stops being monitored when it goes away. Nothing to keep in sync, and a
  # service added by the companion repo needs no change here.
  #
  # The URL is the whole address and not just a port because the fair answer differs per app:
  # /health on Jellyfin, /healthz on laliga-fantasy, / on the *arrs, and Plex and Pi-hole are on
  # the host network so they are probed through the host gateway instead of by container name.
  #
  # The relabeling makes `instance` the probed URL and `service` the container name, which is what
  # the dashboards and the alert rules read.
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_alive]
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_probe]
        regex: '(.+)'
        action: keep
      - source_labels: [__meta_docker_container_label_prometheus_probe]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.+)'
        target_label: service
        replacement: '${1}'
      - target_label: __address__
        replacement: blackbox-exporter:9115
