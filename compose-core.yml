  # --- CORE Services ---
services:
  # --- CADDY (Reverse proxy) ---
  caddy:
    build:
      context: ./config/caddy/
      args:
        CADDY_VERSION: ${CADDY_VERSION}
    container_name: caddy
    labels:
      prometheus.probe: "http://caddy:80/"
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [essential, all]
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CADDY_EMAIL=${CADDY_EMAIL}
      # Target for the Plex redirects, see the Caddyfile
      - STATIC_IP=${STATIC_IP}
    volumes:
      - ${CONFIG_ROOT}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_ROOT}/caddy/services:/etc/caddy/services:ro
      # Routes from a companion repo (EXT_CADDY_PATH in .env); empty dir when there is none
      - ${EXT_CADDY_PATH:-./config/caddy/ext-services}:/etc/caddy/ext-services:ro
      - ${APP_CONFIG_PATH}/caddy/data:/data
      - ${APP_CONFIG_PATH}/caddy/config:/config
    networks:
      - media-network

  # --- HOMEPAGE ---
  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION}
    container_name: homepage
    labels:
      prometheus.probe: "http://homepage:3000/"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [essential, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - HOMEPAGE_VAR_TAILSCALE_IP=${TAILSCALE_IP}
      - HOMEPAGE_VAR_STATIC_IP=${STATIC_IP}
      - HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_API_TOKEN}
      - HOMEPAGE_VAR_PIHOLE_TOKEN=${PIHOLE_TOKEN}
      - HOMEPAGE_VAR_QBIT_PASSWORD=${QBIT_PASSWORD}
      - HOMEPAGE_VAR_OVERSEERR_TOKEN=${OVERSEERR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_TOKEN=${PROWLARR_API_KEY}
      - HOMEPAGE_VAR_AUTOBRR_KEY=${AUTOBRR_API_KEY}
      - HOMEPAGE_VAR_RADARR_TOKEN=${RADARR_API_KEY}
      - HOMEPAGE_VAR_SONARR_TOKEN=${SONARR_API_KEY}
      - HOMEPAGE_VAR_SPEEDTEST_TOKEN=${SPEEDTEST_API_KEY}
      - HOMEPAGE_VAR_JELLYFIN_TOKEN=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_MAINTAINERR_TOKEN=${MAINTAINERR_API_KEY}
      - HOMEPAGE_VAR_TAUTULLI_TOKEN=${TAUTULLI_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
      - ${CONFIG_ROOT}/homepage/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}:${DATA_ROOT}:ro
    networks:
      - media-network

  # --- SPEEDTEST ---
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:${SPEEDTEST_TRACKER_VERSION}
    container_name: speedtest-tracker
    labels:
      prometheus.probe: "http://speedtest-tracker:80/"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [essential, moni, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DB_CONNECTION=sqlite
      - APP_KEY=${SPEEDTEST_KEY}
      - SPEEDTEST_SCHEDULE="47 */6 * * *" # minute 47: 0, 5, 20, 30 and 35 are taken by cron jobs
      - PRUNE_RESULTS_OLDER_THAN=30 # 30 days
    volumes:
      - ${APP_CONFIG_PATH}/speedtest-tracker:/config
      - ${DATA_DB_ROOT}/speedtest.sqlite:/config/database.sqlite
    ports:
      - "8443:80"
    networks:
      - media-network
  # First login is speedtest-tracker's default: admin@example.com / password

  # --- PiHole -AdBlock ---
  pihole:
    container_name: pihole
    labels:
      prometheus.probe: "http://host.docker.internal:8081/"
    image: pihole/pihole:${PIHOLE_VERSION}
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [essential, all]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      # app_sudo defaults to false, which makes an API password session read-only and gets
      # scripts/sync/pihole-dns.sh's writes rejected with a 403 nobody sees.
      FTLCONF_webserver_api_app_sudo: "true"
      FTLCONF_webserver_port: 8081
      WEBPASSWORD: ${PIHOLE_PASSWORD}
    volumes:
      - ${APP_CONFIG_PATH}/pihole:/etc/pihole
      - ${APP_CONFIG_PATH}/dnsmasq.d:/etc/dnsmasq.d
    network_mode: host

  # --- CLOUDFLARED (tunnel — publishes ONLY the GitHub deploy webhook) ---
  # Host network to reach the webhook receiver on 127.0.0.1:9000 (systemd unit in
  # services/deploy-webhook/). What is public is the tunnel's hostname config in Cloudflare's
  # dashboard, not this. See docs/deploy-webhook.md.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION}
    container_name: cloudflared
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    # Deliberately NOT in `all`: with an empty TUNNEL_TOKEN it would crash-loop, so it only
    # starts when `tunnel` is added to COMPOSE_PROFILES explicitly.
    profiles: [tunnel]
    # 0.0.0.0 rather than 127.0.0.1: Prometheus scrapes it through host.docker.internal
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    network_mode: host

networks:
  media-network:
    external: true