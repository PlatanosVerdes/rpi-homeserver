  # --- CORE Services ---
services:
  # --- HOMEPAGE ---
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3001:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.180,192.168.1.180:3001,100.120.107.32,100.120.107.32:3001,streamhalla:3001,ras.pi:3001,streamhalla
      - HOMEPAGE_VAR_TAILSCALE_IP=${TAILSCALE_IP}
      #- HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_API_TOKEN}
      - HOMEPAGE_VAR_PIHOLE_TOKEN=${PIHOLE_PASSWORD}
      # - HOMEPAGE_VAR_QBIT_PASSWORD=${QBIT_PASSWORD}
      # - HOMEPAGE_VAR_OVERSEERR_TOKEN=${OVERSEERR_API_KEY}
      # - HOMEPAGE_VAR_PROWLARR_TOKEN=${PROWLARR_API_KEY}
      # - HOMEPAGE_VAR_RADARR_TOKEN=${RADARR_API_KEY}
      # - HOMEPAGE_VAR_SONARR_TOKEN=${SONARR_API_KEY}
      - HOMEPAGE_VAR_SPEEDTEST_TOKEN=${SPEEDTEST_API_KEY}
      - HOMEPAGE_VAR_JELLYFIN_TOKEN=${JELLYFIN_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}:/mnt/data:ro 
    networks:
      - media-network

  # --- SPEEDTEST ---
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DB_CONNECTION=sqlite
      - APP_KEY=${SPEEDTEST_KEY}
      - SPEEDTEST_SCHEDULE="0 * * * *" #"*/15 * * * *"
      - PRUNE_RESULTS_OLDER_THAN=2
    volumes:
      - ${APP_CONFIG_PATH}/speedtest-tracker:/config
    ports:
      - "8443:80"
    networks:
      - media-network
  # Temp credentials
  # Email: admin@example.com
  # Pass: password 
      
