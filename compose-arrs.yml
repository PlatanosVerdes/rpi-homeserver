# --- Arr's Family ---
services:
  # --- QBITTORRENT (Downloader) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION}
    container_name: qbittorrent
    labels:
      prometheus.probe: "http://qbittorrent:8080/"
    restart: unless-stopped
    profiles: [media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=${QBIT_WEBUI_PORT}
      - TZ=${TZ}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # The one container the internet reaches directly, so the library is not mounted here at all:
    # whatever arrives through the BitTorrent port lands where it cannot see films/ or series/. The
    # arrs keep the full /data, which is what their hardlinks need.
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    volumes:
      - ${APP_CONFIG_PATH}/qbittorrent:/config
      - ${DATA_ROOT}/downloads:/data/downloads
    ports:
      - "${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}"
      # Not 6881: that range is the obvious one to throttle. In .env so a public repo does not
      # advertise it, and scripts/sync/qbit-config.sh pushes the same number into qBittorrent, or the
      # published port and the one it listens on disagree and no peer ever connects.
      - "${QBIT_BT_PORT}:${QBIT_BT_PORT}"
      - "${QBIT_BT_PORT}:${QBIT_BT_PORT}/udp"
    networks:
      - media-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_VERSION}
    container_name: flaresolverr
    labels:
      prometheus.probe: "http://flaresolverr:8191/"
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks:
      - media-network

  # --- PROWLARR (Indexer Manager) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION}
    container_name: prowlarr
    labels:
      prometheus.probe: "http://prowlarr:9696/"
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media-network

  # --- RADARR (Movies) ---
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION}
    container_name: radarr
    labels:
      prometheus.probe: "http://radarr:7878/"
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts: #LaLiga fucking things
      - "api.radarr.video:172.67.180.78"
      - "radarr.servarr.com:172.67.180.78"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "7878:7878"
    networks:
      - media-network

  # --- SONARR (TV Series) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION}
    container_name: sonarr
    labels:
      prometheus.probe: "http://sonarr:8989/"
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8989:8989"
    networks:
      - media-network

  # --- UNPACKERR (unrars scene releases so Radarr/Sonarr can import them) ---
  # Tags by tracker, applies that tracker's seed goal, and notices a torrent the site no longer
  # recognises. It owns deletion: docs/lifecycle.md, config/qbit-manage/config.yml.
  qbit-manage:
    image: ghcr.io/stuffanthings/qbit_manage:${QBIT_MANAGE_VERSION}
    container_name: qbit-manage
    restart: unless-stopped
    mem_limit: 512m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      # The WebUI's whitelist covers the LAN and the tailnet, not the Docker bridge this arrives on
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      - QBT_SCHEDULE=${QBIT_MANAGE_SCHEDULE}
      - QBT_LOG_LEVEL=INFO
    volumes:
      # appdata and not config/: this tool rewrites its own config on every run, which would leave
      # the git tree dirty and block the deploy's pull. apply.sh copies the committed file in.
      - ${APP_CONFIG_PATH}/qbit-manage:/config
      # Only downloads: hardlink counting needs that side, same reasoning as qBittorrent's mount.
      - ${DATA_ROOT}/downloads:/data/downloads
    networks:
      - media-network

  # Reacts to a tracker's IRC announce the second a release is posted, which is what being an early
  # seeder needs: a two-hour-old freeleech uploaded 7.15 GB here against 0.24 GB from a 90-hour-old
  # catalogue torrent. Its filters also cap concurrency, which qBittorrent's RSS cannot, and that
  # matters because a tracker grants a couple of download slots and a partial torrent occupies one.
  # Indexers, IRC credentials and filters live in its own database, set through the web UI.
  autobrr:
    image: ghcr.io/autobrr/autobrr:${AUTOBRR_VERSION}
    container_name: autobrr
    labels:
      prometheus.probe: "http://autobrr:7474/"
    restart: unless-stopped
    mem_limit: 512m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/autobrr:/config
    networks:
      - media-network

  # --- TRACKER-CONTROL (read the account, move the knobs) ---
  # Was two cron scripts handing a reading to each other through a state.json five minutes apart,
  # which is why one of them refused to act on anything older than three hours. One loop reads and
  # acts in the same pass, and is scraped rather than pushing: a wedged loop used to look healthy.
  # DRY_RUN=1 reports what it would change and writes nothing.
  tracker-control:
    build: ./services/tracker-control
    container_name: tracker-control
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [media, all]
    environment:
      - TZ=${TZ}
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      - AUTOBRR_API_KEY=${AUTOBRR_API_KEY}
      - TELEGRAM_ALERT_BOT_TOKEN=${TELEGRAM_ALERT_BOT_TOKEN}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID}
      # Site logins for the three trackers Prowlarr cannot supply: C411 and DigitalCore are
      # API-key definitions and retrotoon is a generic Torznab entry, so none of them holds a
      # username and password to reuse. Empty is fine: the site is then left to its hand-typed
      # figures in config/trackers/readings.json.
      - DIGITALCORE_USER=${DIGITALCORE_USER:-}
      - DIGITALCORE_PASSWORD=${DIGITALCORE_PASSWORD:-}
      - C411_USER=${C411_USER:-}
      - C411_PASSWORD=${C411_PASSWORD:-}
      - RETROTOON_USER=${RETROTOON_USER:-}
      - RETROTOON_PASSWORD=${RETROTOON_PASSWORD:-}
    volumes:
      # The arr and Prowlarr API keys live in their config.xml and nowhere else, and Prowlarr holds
      # TorrentLeech's login, so those secrets are not duplicated into .env. The other three sites
      # have no login in Prowlarr to reuse, which is why theirs are variables above.
      - ${APP_CONFIG_PATH}/radarr:/appdata/radarr:ro
      - ${APP_CONFIG_PATH}/sonarr:/appdata/sonarr:ro
      - ${APP_CONFIG_PATH}/prowlarr:/appdata/prowlarr:ro
      - ${CONFIG_ROOT}/trackers:/config:ro
      # The session cookie and the last reading, kept between restarts: these sites ban for
      # hammering, so a restart must not mean a fresh login.
      - ${APP_CONFIG_PATH}/tracker-stats:/state
      # Read-only, and only to ask how much room is left before the grabber has to pause
      - ${DATA_ROOT}:/mnt/data:ro
    networks:
      - media-network

  # The only free ratio there is: bytes already on this disk, seeded on every private tracker that
  # also has the release. A match is hardlinked, so it costs an inode and starts at 100%. It reads
  # what qBittorrent holds from BT_backup rather than keeping its own list, and searches only the
  # private indexers: a public cross-seed would add a swarm holding this address for no ratio.
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:${CROSS_SEED_VERSION}
    container_name: cross-seed
    labels:
      prometheus.probe: "http://cross-seed:2468/"
    restart: unless-stopped
    mem_limit: 1g
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    command: daemon
    environment:
      - TZ=${TZ}
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
    volumes:
      # The config is a .js file that reads the secrets out of the environment, so it can live in
      # git; only its state (the search cache) belongs in appdata.
      - ${APP_CONFIG_PATH}/cross-seed:/config
      - ./config/cross-seed/config.js:/config/config.js:ro
      # Read-only, and only for the .torrent files qBittorrent keeps: this is the search list.
      - ${APP_CONFIG_PATH}/qbittorrent:/qbit-config:ro
      - ${DATA_ROOT}/downloads:/data/downloads
    networks:
      - media-network

  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:${UNPACKERR_VERSION}
    container_name: unpackerr
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      # UN_*_PATHS_0 must be the path the *arr itself reports, so the /data mount is the same as theirs
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data/downloads
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data/downloads
    volumes:
      - ${DATA_ROOT}:/data
    networks:
      - media-network

networks:
  media-network:
    external: true
