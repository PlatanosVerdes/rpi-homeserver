# --- Arr's Family ---
services:
  # --- QBITTORRENT (Downloader) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION}
    container_name: qbittorrent
    restart: unless-stopped
    profiles: [media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=${QBIT_WEBUI_PORT}
      - TZ=${TZ}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Hardening, because this is the one container the internet can reach directly once the
    # BitTorrent port is forwarded. It only ever writes to downloads (all 64 torrents have
    # save_path /data/downloads), so the library is not mounted here at all: whatever comes
    # through that port lands somewhere that cannot see films/ or series/. The *arrs keep the
    # full /data, which is what their hardlinks need.
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    volumes:
      - ${APP_CONFIG_PATH}/qbittorrent:/config
      - ${DATA_ROOT}/downloads:/data/downloads
    ports:
      - "${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}"
      # Deliberately not 6881: that range is the obvious one to throttle. The value lives in .env
      # so a public repo does not advertise it, and scripts/sync/qbit-config.sh pushes the same number into
      # qBittorrent, because a listen port the container does not publish means zero inbound peers.
      - "${QBIT_BT_PORT}:${QBIT_BT_PORT}"
      - "${QBIT_BT_PORT}:${QBIT_BT_PORT}/udp"
    networks:
      - media-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_VERSION}
    container_name: flaresolverr
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks:
      - media-network

  # --- PROWLARR (Indexer Manager) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION}
    container_name: prowlarr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media-network

  # --- RADARR (Movies) ---
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION}
    container_name: radarr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts: #LaLiga fucking things
      - "api.radarr.video:172.67.180.78"
      - "radarr.servarr.com:172.67.180.78"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "7878:7878"
    networks:
      - media-network

  # --- SONARR (TV Series) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION}
    container_name: sonarr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8989:8989"
    networks:
      - media-network

  # --- UNPACKERR (unrars scene releases so Radarr/Sonarr can import them) ---
  # Torrent lifecycle: tags by tracker, applies a seed goal per tracker, and notices a torrent the
  # tracker no longer recognises. Running in DRY RUN alongside scripts/trackers/seed-cleanup.py until their
  # decisions agree, then it replaces it. See PENDING.md and config/qbit-manage/config.yml.
  qbit-manage:
    image: ghcr.io/stuffanthings/qbit_manage:${QBIT_MANAGE_VERSION}
    container_name: qbit-manage
    restart: unless-stopped
    mem_limit: 512m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      # The WebUI's whitelist covers the LAN and the tailnet, not the Docker bridge this arrives on
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      - QBT_SCHEDULE=${QBIT_MANAGE_SCHEDULE}
      - QBT_LOG_LEVEL=INFO
    volumes:
      # appdata, not config/: this tool rewrites its own config file on every run, filling in the
      # defaults it wants, which would leave the git working tree dirty and block the deploy's pull.
      # config/qbit-manage/config.yml is the source, scripts/deploy/apply.sh copies it in when it changes.
      - ${APP_CONFIG_PATH}/qbit-manage:/config
      # Only downloads: hardlink counting needs the download side, and the library is none of its
      # business, the same reasoning as qBittorrent's own mount
      - ${DATA_ROOT}/downloads:/data/downloads
    networks:
      - media-network

  # Reacts to a tracker's IRC announce channel the second a release is posted, which is the only way
  # to be an early seeder: an RSS poll arrives minutes later, when the swarm already has thirty
  # seeds. Measured on 2026-08-21, the difference this makes: a freeleech release two hours old had
  # uploaded 7.15 GB, while a catalogue torrent seeded for 90 hours had managed 0.24 GB.
  #
  # Its own filters cap concurrency, which qBittorrent's RSS cannot: TorrentLeech grants two
  # download slots and a partially downloaded torrent occupies one, so grabbing five at once jams
  # the account. Everything else (indexers, IRC credentials, filters) lives in its own database and
  # is set through the web UI, since it holds per-tracker secrets.
  autobrr:
    image: ghcr.io/autobrr/autobrr:${AUTOBRR_VERSION}
    container_name: autobrr
    restart: unless-stopped
    mem_limit: 512m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/autobrr:/config
    networks:
      - media-network

  # The only free ratio there is: the same bytes already on this disk, seeded on every private
  # tracker that also has the release. Matches are hardlinked, so a cross-seed costs an inode and no
  # space, and the torrent starts at 100% with nothing to download.
  #
  # It reads what qBittorrent already holds (its BT_backup folder, read-only) rather than keeping its
  # own list, searches the private indexers through Prowlarr, and injects matches back. Public
  # indexers are deliberately absent: there is no account or ratio on a public tracker, so a
  # cross-seed there would only add one more public swarm holding this address.
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:${CROSS_SEED_VERSION}
    container_name: cross-seed
    restart: unless-stopped
    mem_limit: 1g
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    command: daemon
    environment:
      - TZ=${TZ}
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
    volumes:
      # The config is a .js file that reads the secrets out of the environment, so it can live in
      # git; only its state (the search cache) belongs in appdata.
      - ${APP_CONFIG_PATH}/cross-seed:/config
      - ./config/cross-seed/config.js:/config/config.js:ro
      # Read-only, and only for the .torrent files qBittorrent keeps: this is the search list.
      - ${APP_CONFIG_PATH}/qbittorrent:/qbit-config:ro
      - ${DATA_ROOT}/downloads:/data/downloads
    networks:
      - media-network

  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:${UNPACKERR_VERSION}
    container_name: unpackerr
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      # UN_*_PATHS_0 must be the path the *arr itself reports, so the /data mount is the same as theirs
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data/downloads
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data/downloads
    volumes:
      - ${DATA_ROOT}:/data
    networks:
      - media-network

networks:
  media-network:
    external: true
