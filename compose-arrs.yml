# --- Arr's Family ---
services:
  # --- QBITTORRENT (Downloader) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION}
    container_name: qbittorrent
    restart: unless-stopped
    profiles: [media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=${QBIT_WEBUI_PORT}
      - TZ=${TZ}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${APP_CONFIG_PATH}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - media-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_VERSION}
    container_name: flaresolverr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks:
      - media-network

  # --- BYPARR (FlareSolverr drop-in; Camoufox browser, better against Cloudflare) ---
  # Reached internally as http://byparr:8191 (no host port, to avoid clashing with flaresolverr).
  byparr:
    image: ghcr.io/thephaseless/byparr:${BYPARR_VERSION}
    container_name: byparr
    restart: unless-stopped
    profiles: [media, all]
    shm_size: 1gb
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TZ=${TZ}
    networks:
      - media-network

  # --- PROWLARR (Indexer Manager) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION}
    container_name: prowlarr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media-network

  # --- RADARR (Movies) ---
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION}
    container_name: radarr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts: #LaLiga fucking things
      - "api.radarr.video:172.67.180.78"
      - "radarr.servarr.com:172.67.180.78"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "7878:7878"
    networks:
      - media-network

  # --- SONARR (TV Series) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION}
    container_name: sonarr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8989:8989"
    networks:
      - media-network

networks:
  media-network:
    external: true
