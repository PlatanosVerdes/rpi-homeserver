  # --- Media servicess ---
services:
  # --- PLEX (Media Player) ---
  plex:
    image: lscr.io/linuxserver/plex:${PLEX_VERSION}
    container_name: plex
    restart: unless-stopped
    profiles: [media, all]
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${APP_CONFIG_PATH}/plex:/config
      - ${DATA_ROOT}:/data

  # --- JELLYFIN (Free Media Player) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_VERSION}
    container_name: jellyfin
    restart: unless-stopped
    profiles: [acestream, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    networks:
      - media-network

  # --- OVERSEERR (Request Management) ---
  overseerr:
    image: lscr.io/linuxserver/overseerr:${OVERSEERR_VERSION}
    container_name: overseerr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/overseerr:/config
    ports:
      - "5055:5055"
    networks:
      - media-network


  # --- Acestream ---
  aceserve:
    image: jopsis/aceserve@${ACESERVE_DIGEST}
    container_name: aceserve
    profiles: [acestream, all]
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      - TZ=${TZ}

  # --- Acestream warmup proxy ---
  # Sits between Jellyfin and aceserve. Retries on HTTP 500 (stream not ready yet)
  # for up to 45s so Jellyfin doesn't give up before the P2P swarm is established.
  acestream-proxy:
    build: ./services/acestream-proxy
    container_name: acestream-proxy
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [acestream, all]
    environment:
      - ACESERVE_BASE_URL=http://172.19.0.1:6878
      - LISTEN_ADDR=:6879
      - PLAYLIST_PATH=/playlists/channels_ace.m3u
    volumes:
      # Read-only, only to turn the 40-hex content id into the channel name in the logs
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/playlists:ro
    networks:
      - media-network

  # --- Acestream playlist updater + channel health checker ---
  acestream-updater:
    build: ./services/acestream-updater
    container_name: acestream-updater
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [acestream, all]
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - media-network
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/data
      - ${APP_CONFIG_PATH}/acestream-updater:/app
    environment:
      - TZ=${TZ}
      - OUTPUT_FILE=/data/channels_ace.m3u
      - SOURCE_URLS=https://k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr.ipns.dweb.link/hashes_acestream.m3u,https://ipfs.io/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u,https://dweb.link/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u
      - ACESERVE_URL=http://172.19.0.1:6878/ace/getstream?id=
      - STREAM_BASE_URL=http://acestream-proxy:6879/ace/getstream?id=
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}

  # --- BAZARR (auto-download subtitles; Spanish, for the whole library) ---
  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION}
    container_name: bazarr
    restart: unless-stopped
    # Capped after 2026-08-19: a SignalR reconnect loop against Radarr leaked 979 threads and ate a
    # whole core for an hour. One core is more than it ever needs for subtitles.
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    profiles: [media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/bazarr:/config
      - ${DATA_ROOT}:/data
    networks:
      - media-network

  # --- MAINTAINERR (auto-clean watched media by rules; movies-only rule) ---
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:${MAINTAINERR_VERSION}
    container_name: maintainerr
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/maintainerr:/opt/data
    networks:
      - media-network

  # --- TAUTULLI (Plex watch history / notifications) ---
  tautulli:
    image: ghcr.io/tautulli/tautulli:${TAUTULLI_VERSION}
    container_name: tautulli
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/tautulli:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  # --- watch-next: monitor + search the next Sonarr episode(s) when one is watched ---
  # See docs/watch-next.md. Reached by Tautulli/Jellyfin over media-network by container name,
  # never published to the host, so the shared WATCH_NEXT_TOKEN is defense-in-depth, not the
  # only thing standing between it and the internet.
  watch-next:
    build: ./services/watch-next
    container_name: watch-next
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [media, all]
    environment:
      - WATCH_NEXT_TOKEN=${WATCH_NEXT_TOKEN}
      - WATCH_NEXT_MARGIN=${WATCH_NEXT_MARGIN}
      - PUSHGATEWAY_URL=http://pushgateway:9091
    volumes:
      - ${APP_CONFIG_PATH}/sonarr/config.xml:/config.xml:ro
    networks:
      - media-network

  # --- subtitle-links: a page listing movies with a downloadable text subtitle, filtered by language ---
  subtitle-links:
    build: ./services/subtitle-links
    container_name: subtitle-links
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [media, all]
    environment:
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    networks:
      - media-network

  # --- farnsworth: a page that hands an Acestream channel to VLC ---
  # Named for Philo Farnsworth, who built the first working electronic television.
  farnsworth:
    build: ./services/farnsworth
    container_name: farnsworth
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [acestream, all]
    environment:
      # The address VLC will dial, so it must be one the phone or laptop can reach, never a
      # container name. The video goes straight from the engine to the player.
      - STREAM_BASE=http://${STATIC_IP}:6878
      - PLAYLIST_PATH=/playlists/channels_ace.m3u
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/playlists:ro
    networks:
      - media-network

networks:
  media-network:
    external: true
