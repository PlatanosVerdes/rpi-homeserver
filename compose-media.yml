  # --- Media servicess ---
services:
  # --- PLEX (Media Player) ---
  # plex:
  #   image: lscr.io/linuxserver/plex:latest
  #   container_name: plex
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - VERSION=docker
  #     - TZ=${TZ}
  #     - PLEX_CLAIM=${PLEX_CLAIM}
  #   volumes:
  #     - ${APP_CONFIG_PATH}/plex:/config
  #     - ${DATA_ROOT}:/data

  # --- JELLYFIN (Free Media Player) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    networks:
      - media-network

  # --- OVERSEERR (Request Management) ---
  #overseerr:
  #  image: lscr.io/linuxserver/overseerr:latest
  #  container_name: overseerr
  #  restart: unless-stopped
  #  dns:
  #    - 8.8.8.8
  #    - 1.1.1.1
  #  environment:
  #    - PUID=${PUID}
  #    - PGID=${PGID}
  #    - TZ=${TZ}
  #  volumes:
  #    - ${APP_CONFIG_PATH}/overseerr:/config
  #  ports:
  #    - "5055:5055"
  #  networks:
  #    - media-network

  # --- Acestream ---
  # Spanish ISPs answer api.acestream.me with a fake certificate during matches, so the engine
  # cannot resolve a channel. Only its HTTPS goes through this tunnel; the P2P stays on the home
  # line, where channels start in seconds instead of the 30 s of an inbound-less VPN.
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_COUNTRY}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - FIREWALL_INPUT_PORTS=8888
      # Nord retires servers and the list baked into the image goes stale with them.
      - UPDATER_PERIOD=24h
    volumes:
      - ${APP_CONFIG_PATH}/gluetun:/gluetun
    networks:
      - media-network

  aceserve:
    image: jopsis/aceserve:latest
    container_name: aceserve
    depends_on:
      gluetun:
        condition: service_healthy
    ports:
      - "6878:6878"
      - "8621:8621"
      - "62062:62062"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # The engine is Python and its API calls go through urllib, which honours these.
      - https_proxy=http://gluetun:8888
      - HTTPS_PROXY=http://gluetun:8888
      - no_proxy=localhost,127.0.0.1
    volumes:
      - ${CONFIG_ROOT}/aceserve/acestream.conf:/acestream/acestream.conf:ro
      - ${CONFIG_ROOT}/aceserve/log-filter.awk:/acestream/log-filter.awk:ro
      - ${CONFIG_ROOT}/aceserve/dnsproxyd.py:/acestream/dnsproxyd.py:ro
      # Docker's own DNS, so the engine finds "gluetun" by name; see the file for why it is needed.
      - ${CONFIG_ROOT}/aceserve/resolv.conf:/etc/resolv.conf:ro
    command:
      - sh
      - -c
      - python main.py --bind-all --live-cache-type memory --live-mem-cache-size 104857600 --disable-sentry --log-stdout --disable-upnp 2>&1 | awk -f /acestream/log-filter.awk
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - media-network

  # --- IPFS node, the only unthrottled route to the Acestream playlist ---
  kubo:
    image: ipfs/kubo:v0.43.0
    container_name: kubo
    # Everything, healthcheck included, as the image's ipfs user, so nothing creates a
    # root-owned repo.lock that the daemon then cannot take.
    user: "1000:100"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    # No published ports: the gateway is for bifrost, over the docker network.
    environment:
      - TZ=${TZ}
      - IPFS_PROFILE=lowpower
      - IPFS_PATH=/data/ipfs
    command: ["daemon", "--migrate=true", "--routing=autoclient"]
    volumes:
      - ${APP_CONFIG_PATH}/kubo:/data/ipfs
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- bifrost: the AceStream list and the proxy Jellyfin plays from (github.com/PlatanosVerdes/bifrost) ---
  # Same image as the main Pi. Writes Jellyfin's playlist (one stable URL per channel) and a guide cut
  # down to those channels, and serves /channel/<slug>. It never opens a channel on its own.
  bifrost:
    image: ghcr.io/platanosverdes/bifrost:v2026.10.17.3
    container_name: bifrost
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - media-network
    depends_on:
      - kubo
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/data
      - ${APP_CONFIG_PATH}/bifrost:/state
    environment:
      - TZ=${TZ}
      - SOURCE_URLS=http://kubo:8080/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u,https://ipfs.io/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u,https://dweb.link/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u
      - ACESERVE_BASE_URL=http://aceserve:6878
      - CHANNEL_BASE_URL=http://bifrost:6879/channel/
      - GUIDE_SOURCE_URL=https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}

networks:
  media-network:
    external: true
