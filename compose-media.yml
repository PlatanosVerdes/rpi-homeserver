  # --- Media servicess ---
services:
  # --- PLEX (Media Player) ---
  plex:
    image: lscr.io/linuxserver/plex:${PLEX_VERSION}
    container_name: plex
    restart: unless-stopped
    profiles: [media, all]
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${APP_CONFIG_PATH}/plex:/config
      - ${DATA_ROOT}:/data

  # --- JELLYFIN (Free Media Player) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_VERSION}
    container_name: jellyfin
    restart: unless-stopped
    profiles: [acestream, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    networks:
      - media-network

  # --- OVERSEERR (Request Management) ---
  overseerr:
    image: lscr.io/linuxserver/overseerr:${OVERSEERR_VERSION}
    container_name: overseerr
    restart: unless-stopped
    profiles: [media, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/overseerr:/config
    ports:
      - "5055:5055"
    networks:
      - media-network


  # --- Acestream's VPN ---
  # The engine sits inside this namespace, so what leaves the Pi for the swarm leaves from
  # NordVPN. That is the whole point: the ISP stops seeing which streams are being pulled, and
  # the TLS interception that takes the trackers down during football windows is tunnelled past.
  #
  # Nord forwards no port (it refuses as policy), so the engine is outbound-only in the swarm.
  # For watching, that works; it is why the warmup proxy exists and it may need a longer window.
  gluetun-ace:
    image: qmcgaw/gluetun:${GLUETUN_VERSION}
    container_name: gluetun-ace
    profiles: [acestream, all]
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      # Read for VPN_TYPE=openvpn, ignored for wireguard, and the other way round below.
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASS}
      - OPENVPN_PROTOCOL=${VPN_PROTOCOL}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_COUNTRY}
      # Without this the firewall drops what arrives for aceserve: a port published here is
      # still an inbound connection as far as gluetun is concerned.
      - FIREWALL_INPUT_PORTS=6878
    # Published here, not on aceserve: a container in this namespace owns no ports of its own.
    # Keeping 6878 on the host is what leaves farnsworth's STREAM_BASE working unchanged.
    ports:
      - "6878:6878"
    networks:
      - media-network

  # --- Acestream ---
  aceserve:
    image: jopsis/aceserve@${ACESERVE_DIGEST}
    container_name: aceserve
    profiles: [acestream, all]
    # Was host networking. Now it has no network of its own: it lives in gluetun's namespace,
    # so it cannot reach the internet if the tunnel is down. That is the kill switch.
    network_mode: "service:gluetun-ace"
    depends_on:
      - gluetun-ace
    restart: unless-stopped
    # Raised after 2026-08-23: the engine buffers the live stream in RAM and fills a 1 GB cache, so
    # the old 256m cap had the kernel OOM-killing it every 10-15 min of streaming. Peak is 1.153 GB.
    mem_limit: 1600m
    memswap_limit: 1600m
    environment:
      - TZ=${TZ}

  # --- Acestream warmup proxy ---
  # Sits between Jellyfin and aceserve. Retries on HTTP 500 (stream not ready yet)
  # for up to 45s so Jellyfin doesn't give up before the P2P swarm is established.
  acestream-proxy:
    build: ./services/acestream-proxy
    container_name: acestream-proxy
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [acestream, all]
    environment:
      - ACESERVE_BASE_URL=http://gluetun-ace:6878
      - LISTEN_ADDR=:6879
      - PLAYLIST_PATH=/playlists/channels_ace.m3u
    volumes:
      # Read-only, only to turn the 40-hex content id into the channel name in the logs
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/playlists:ro
    networks:
      - media-network

  # --- Acestream playlist updater + channel health checker ---
  acestream-updater:
    build: ./services/acestream-updater
    container_name: acestream-updater
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [acestream, all]
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - media-network
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/data
      - ${APP_CONFIG_PATH}/acestream-updater:/app
    environment:
      - TZ=${TZ}
      - OUTPUT_FILE=/data/channels_ace.m3u
      - SOURCE_URLS=https://k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr.ipns.dweb.link/hashes_acestream.m3u,https://ipfs.io/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u,https://dweb.link/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u
      - ACESERVE_URL=http://gluetun-ace:6878/ace/getstream?id=
      - STREAM_BASE_URL=http://acestream-proxy:6879/ace/getstream?id=
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}

  # --- BAZARR (auto-download subtitles; Spanish, for the whole library) ---
  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION}
    container_name: bazarr
    restart: unless-stopped
    # Capped after 2026-08-19: a SignalR reconnect loop against Radarr leaked 979 threads and ate a
    # whole core for an hour. One core is more than it ever needs for subtitles.
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    profiles: [media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/bazarr:/config
      - ${DATA_ROOT}:/data
    networks:
      - media-network

  # --- MAINTAINERR (auto-clean watched media by rules; movies-only rule) ---
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:${MAINTAINERR_VERSION}
    container_name: maintainerr
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [media, all]
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/maintainerr:/opt/data
    networks:
      - media-network

  # --- TAUTULLI (Plex watch history / notifications) ---
  tautulli:
    image: ghcr.io/tautulli/tautulli:${TAUTULLI_VERSION}
    container_name: tautulli
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/tautulli:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  # --- watch-next: monitor + search the next Sonarr episode(s) when one is watched ---
  # See docs/watch-next.md. Reached by Tautulli/Jellyfin over media-network by container name,
  # never published to the host, so the shared WATCH_NEXT_TOKEN is defense-in-depth, not the
  # only thing standing between it and the internet.
  watch-next:
    build: ./services/watch-next
    container_name: watch-next
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [media, all]
    environment:
      - WATCH_NEXT_TOKEN=${WATCH_NEXT_TOKEN}
      - WATCH_NEXT_MARGIN=${WATCH_NEXT_MARGIN}
      - PUSHGATEWAY_URL=http://pushgateway:9091
    volumes:
      - ${APP_CONFIG_PATH}/sonarr/config.xml:/config.xml:ro
    networks:
      - media-network

  # --- subtitle-links: a page listing movies with a downloadable text subtitle, filtered by language ---
  subtitle-links:
    build: ./services/subtitle-links
    container_name: subtitle-links
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [media, all]
    environment:
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    networks:
      - media-network

  # --- farnsworth: a page that hands an Acestream channel to VLC ---
  # Named for Philo Farnsworth, who built the first working electronic television.
  farnsworth:
    build: ./services/farnsworth
    container_name: farnsworth
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [acestream, all]
    environment:
      # The address VLC will dial, so it must be one the phone or laptop can reach, never a
      # container name. The video goes straight from the engine to the player.
      - STREAM_BASE=http://${STATIC_IP}:6878
      - PLAYLIST_PATH=/playlists/channels_ace.m3u
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/playlists:ro
    networks:
      - media-network

networks:
  media-network:
    external: true
