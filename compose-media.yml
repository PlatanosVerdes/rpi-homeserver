  # --- Media servicess ---
services:
  # --- PLEX (Media Player) ---
  plex:
    image: lscr.io/linuxserver/plex:${PLEX_VERSION}
    container_name: plex
    labels:
      host.ports: "32400/tcp 1901/udp 32410/udp 32412/udp 32413/udp 32414/udp"
      prometheus.probe: "http://host.docker.internal:32400/identity"
    restart: unless-stopped
    profiles: [plex, media, all]
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${APP_CONFIG_PATH}/plex:/config
      - ${DATA_ROOT}:/data

  # --- JELLYFIN (Free Media Player) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_VERSION}
    container_name: jellyfin
    labels:
      host.ports: "8096/tcp 7359/udp"
      prometheus.probe: "http://host.docker.internal:8096/health"
    restart: unless-stopped
    profiles: [jellyfin, acestream, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin:/config
      - ${DATA_ROOT}:/data
    # On the host network, so the live stream URL Jellyfin hands to a TV carries the LAN address and
    # not the container's, which TVs cannot reach. bifrost stays known by name, on its loopback port.
    network_mode: host
    extra_hosts:
      - "bifrost:127.0.0.1"
    devices:
      - /dev/dri:/dev/dri

  # --- SEERR (Request Management) ---
  # Overseerr was archived upstream in February 2026 and Seerr is its continuation. Three things
  # differ from the LinuxServer image this replaces, and each one loses data or fails to start if it
  # is missed:
  #   - the config directory mounts at /app/config, not /config
  #   - init: true is required, since the process does not reap its own children
  #   - it runs as the node user (uid 1000) and has no PUID/PGID, so appdata must be owned by 1000
  # The settings.json and db/db.sqlite3 layout is the same, so the existing directory carries over
  # and Seerr migrates the database itself on first start. Guide: https://docs.seerr.dev/migration-guide/
  seerr:
    image: ghcr.io/seerr-team/seerr:${SEERR_VERSION}
    container_name: seerr
    init: true
    labels:
      prometheus.probe: "http://seerr:5055/"
    restart: unless-stopped
    profiles: [seerr, media, all]
    # Its own resolver, because Pi-hole blocks some of the metadata hosts it reads.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/seerr:/app/config
    ports:
      - "127.0.0.1:5055:5055"
    networks:
      - media-network


  # --- Acestream ---
  # Spanish ISPs answer api.acestream.me with a fake certificate, so the engine cannot resolve a
  # single channel. Only its HTTPS goes through this tunnel; the P2P stays on the home line, where
  # channels start in about 2 s instead of the 30 s and failed starts of an inbound-less VPN.
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_VERSION}
    container_name: gluetun
    profiles: [gluetun, acestream, all]
    restart: unless-stopped
    labels:
      sleipnir.enable: "true"
      sleipnir.used-by: "aceserve (HTTPS)"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASS}
      - OPENVPN_PROTOCOL=${VPN_PROTOCOL}
      - SERVER_COUNTRIES=${VPN_COUNTRY}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - FIREWALL_INPUT_PORTS=8888
      # The control server sleipnir drives; every route needs this key. gluetun exits on an empty
      # one, so compose refuses to run without it and a missing key leaves the running tunnel alone.
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set GLUETUN_API_KEY in .env, see docs/sleipnir.md}"}'
      # Nord retires servers and the list baked into the image goes stale with them.
      - UPDATER_PERIOD=24h
    volumes:
      - ${APP_CONFIG_PATH}/gluetun:/gluetun
    networks:
      - media-network

  aceserve:
    image: jopsis/aceserve@${ACESERVE_DIGEST}
    container_name: aceserve
    labels:
      host.ports: "6878/tcp 62062/tcp 8621/udp"
    profiles: [aceserve, acestream, all]
    network_mode: host
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    # The engine buffers the live stream in RAM and fills a 1 GB cache, peaking at 1.153 GB: under
    # that the kernel OOM-kills it every 10-15 min of streaming.
    mem_limit: 1600m
    memswap_limit: 1600m
    environment:
      - TZ=${TZ}
      # The engine is Python and its API calls go through urllib, which honours these.
      - https_proxy=http://127.0.0.1:8888
      - HTTPS_PROXY=http://127.0.0.1:8888
      - no_proxy=localhost,127.0.0.1

  # --- IPFS node, the only unthrottled route to the Acestream playlist ---
  kubo:
    image: ipfs/kubo:${KUBO_VERSION}
    container_name: kubo
    # Everything, healthcheck included, as the image's ipfs user, so nothing creates a
    # root-owned repo.lock that the daemon then cannot take.
    user: "1000:100"
    labels:
      prometheus.probe: "http://kubo:8080/version"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    profiles: [kubo, acestream, all]
    # No published ports: the gateway is for bifrost, over the docker network.
    environment:
      - TZ=${TZ}
      - IPFS_PROFILE=lowpower
      - IPFS_PATH=/data/ipfs
    command: ["daemon", "--migrate=true", "--routing=autoclient"]
    volumes:
      - ${APP_CONFIG_PATH}/kubo:/data/ipfs
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- bifrost: the AceStream list and the proxy Jellyfin plays from (github.com/PlatanosVerdes/bifrost) ---
  # Writes Jellyfin's playlist (one stable URL per channel) and a guide cut down to those channels,
  # and serves /channel/<slug>, trying the sources one at a time and sharing one engine connection
  # per channel. It never opens a channel on its own: this Pi plays one at a time.
  bifrost:
    image: ghcr.io/platanosverdes/bifrost:${BIFROST_VERSION}
    user: "${PUID}:${PGID}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    container_name: bifrost
    labels:
      prometheus.probe: "http://bifrost:6879/healthz"
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [bifrost, acestream, all]
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - media-network
    # Loopback only: Jellyfin, on the host network, reaches the proxy here.
    ports:
      - "127.0.0.1:6879:6879"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kubo
    volumes:
      - ${APP_CONFIG_PATH}/jellyfin/acestream:/data
      - ${APP_CONFIG_PATH}/bifrost:/state
    environment:
      - TZ=${TZ}
      - SOURCE_URLS=http://kubo:8080/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u,https://ipfs.io/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u,https://dweb.link/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u
      - ACESERVE_BASE_URL=http://172.19.0.1:6878
      - CHANNEL_BASE_URL=http://bifrost:6879/channel/
      # Cut down to our channels into guide.xml, which Jellyfin reads (scripts/sync/jellyfin-guide.sh).
      - GUIDE_SOURCE_URL=https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - JELLYFIN_URL=http://host.docker.internal:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - BIFROST_NAME=Raspberry
      # Sharing from the page (docs/access.md); off while any of the four is empty; invite links also need ACCESS_JOIN_AUD.
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:-}
      - ACCESS_AUD=${BIFROST_ACCESS_AUD:-}
      - ACCESS_JOIN_AUD=${BIFROST_ACCESS_JOIN_AUD:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${BIFROST_CLOUDFLARE_API_TOKEN:-}
      - BIFROST_ADMINS=${BIFROST_ADMINS:-}

  # --- BAZARR (auto-download subtitles; Spanish, for the whole library) ---
  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION}
    container_name: bazarr
    labels:
      prometheus.probe: "http://bazarr:6767/"
    restart: unless-stopped
    # Capped at one core: a SignalR reconnect loop against Radarr can leak threads until it eats a
    # whole one, and subtitles never need more.
    cpus: 1.0
    # 512m was its working size, not a ceiling: 25.8k limit hits in a day and a half.
    mem_limit: 768m
    memswap_limit: 768m
    profiles: [bazarr, media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/bazarr:/config
      - ${DATA_ROOT}:/data
    networks:
      - media-network

  # --- MAINTAINERR (auto-clean watched media by rules; movies-only rule) ---
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:${MAINTAINERR_VERSION}
    container_name: maintainerr
    labels:
      prometheus.probe: "http://maintainerr:6246/"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [maintainerr, media, all]
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/maintainerr:/opt/data
    networks:
      - media-network

  # --- TAUTULLI (Plex watch history / notifications) ---
  tautulli:
    image: ghcr.io/tautulli/tautulli:${TAUTULLI_VERSION}
    container_name: tautulli
    labels:
      prometheus.probe: "http://tautulli:8181/"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [tautulli, media, all]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APP_CONFIG_PATH}/tautulli:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  # --- watch-next: monitor + search the next Sonarr episode(s) when one is watched ---
  # See docs/watch-next.md. Never published to the host, so WATCH_NEXT_TOKEN is defence in depth
  # rather than the only thing between it and the internet.
  watch-next:
    # Built by CI and pulled; build: is only the fallback, see docs/service-images.md.
    image: ghcr.io/platanosverdes/rpi-homeserver-watch-next:${WATCH_NEXT_IMAGE_TAG}
    build: ./services/watch-next
    container_name: watch-next
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [watch-next, media, all]
    environment:
      - WATCH_NEXT_TOKEN=${WATCH_NEXT_TOKEN}
      - WATCH_NEXT_MARGIN=${WATCH_NEXT_MARGIN}
      - PUSHGATEWAY_URL=http://pushgateway:9091
    volumes:
      - ${APP_CONFIG_PATH}/sonarr/config.xml:/config.xml:ro
    networks:
      - media-network

  # --- subtitle-links: a page listing movies with a downloadable text subtitle, filtered by language ---
  subtitle-links:
    image: ghcr.io/platanosverdes/rpi-homeserver-subtitle-links:${SUBTITLE_LINKS_IMAGE_TAG}
    build: ./services/subtitle-links
    container_name: subtitle-links
    labels:
      prometheus.probe: "http://subtitle-links:8085/"
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [subtitle-links, media, all]
    environment:
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_URL=http://host.docker.internal:8096
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  # --- audio-convert: the files a client had its audio re-encoded on, and a button to fix one ---
  # pi-metrics works out the plan, scripts/sync/audio-compat.py --file does the conversion; this
  # lists the first and runs the second. Tailnet only, like every page Caddy serves without Access.
  audio-convert:
    # Built by CI and pulled; build: is only the fallback, see docs/service-images.md.
    image: ghcr.io/platanosverdes/rpi-homeserver-audio-convert:${AUDIO_CONVERT_IMAGE_TAG}
    build:
      context: ./services/audio-convert
      args:
        GO_IMAGE: ${AUDIO_CONVERT_GO_IMAGE}
        ALPINE_VERSION: ${AUDIO_CONVERT_ALPINE_VERSION}
        FFMPEG_VERSION: ${AUDIO_CONVERT_FFMPEG_VERSION}
        PYTHON_VERSION: ${AUDIO_CONVERT_PYTHON_VERSION}
    container_name: audio-convert
    labels:
      prometheus.probe: "http://audio-convert:8088/"
    restart: unless-stopped
    # ffmpeg holds a few MB per stream for a remux; the AC3 encode is the only real work.
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [audio-convert, media, all]
    # The owner of every library file, so a converted file and its .original keep it.
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - DATA_ROOT=/mnt/data
      - AUDIO_RECODES=/ledger/audio-recodes.json
      - AUDIO_CONVERT_STATE=/state
    volumes:
      # Read-write: a conversion writes the new file beside the old one and renames both. Only the
      # two libraries, so downloads and everything else on the disk stay out of its reach.
      - ${DATA_ROOT}/films:/mnt/data/films
      - ${DATA_ROOT}/series:/mnt/data/series
      # pi-metrics' ledger with each file's plan, read-only.
      - ${APP_CONFIG_PATH}/pi-metrics:/ledger:ro
      # The queue, the shared lock and history.jsonl. The host's audio-compat.py uses the same
      # directory from cron, which is what keeps the night run and this from converting at once.
      - ${APP_CONFIG_PATH}/audio-convert:/state
      # The directory and not the file: git replaces the script on a pull, and a single-file bind
      # mount would keep the old inode. Mounted, not copied, so a script change needs no rebuild.
      - ./scripts/sync:/scripts:ro
    networks:
      - media-network

  # --- farnsworth: a page that hands an Acestream channel to VLC ---
  # Named for Philo Farnsworth, who built the first working electronic television.
  farnsworth:
    image: ghcr.io/platanosverdes/rpi-homeserver-farnsworth:${FARNSWORTH_IMAGE_TAG}
    build: ./services/farnsworth
    container_name: farnsworth
    labels:
      prometheus.probe: "http://farnsworth:8086/"
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [farnsworth, acestream, all]
    environment:
      # The address VLC will dial, so it must be one the phone or laptop can reach, never a
      # container name. The video goes straight from the engine to the player.
      - STREAM_BASE=http://${STATIC_IP}:6878
      # The channel list and each channel's current source; Jellyfin's M3U only has bifrost's URLs.
      - BIFROST_URL=http://bifrost:6879
    networks:
      - media-network

  # --- sleipnir: see and move every gluetun tunnel on this machine (github.com/PlatanosVerdes/sleipnir) ---
  # Tunnels are found by the sleipnir.enable label, through a socket proxy that only lets it list
  # containers. It changes where a tunnel exits; which container uses which tunnel stays in compose.
  sleipnir:
    image: ghcr.io/platanosverdes/sleipnir:${SLEIPNIR_VERSION}
    container_name: sleipnir
    labels:
      prometheus.probe: "http://sleipnir:8090/healthz"
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [sleipnir, vpn, all]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    # Only for the panels on other machines, over Tailscale; opened only with SLEIPNIR_TOKEN set.
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8092:8092"
    environment:
      - TZ=${TZ}
      - DOCKER_HOST_URL=http://docker-socket-proxy:2375
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - SLEIPNIR_NAME=${SLEIPNIR_NAME:-}
      - SLEIPNIR_PEERS=${SLEIPNIR_PEERS:-}
      - SLEIPNIR_TOKEN=${SLEIPNIR_TOKEN:-}
      - PEER_LISTEN_ADDR=:8092
    volumes:
      # gluetun's own server list, kept current by its updater: the countries a tunnel can pick.
      - ${APP_CONFIG_PATH}/gluetun/servers.json:/servers.json:ro
    networks:
      - media-network
      - docker-api

  # --- muninn: who uses each bot and how much traffic reaches it (github.com/PlatanosVerdes/muninn) ---
  # Bots are found by the muninn.stats label, through the same socket proxy as sleipnir; muninn
  # reads each one's /bot-stats over the muninn network, holds no token and sends nothing.
  muninn:
    image: ghcr.io/platanosverdes/muninn:${MUNINN_VERSION}
    container_name: muninn
    labels:
      prometheus.probe: "http://muninn:8095/healthz"
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [muninn, bots, all]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    environment:
      - TZ=${TZ}
      - DOCKER_HOST_URL=http://docker-socket-proxy:2375
      - MUNINN_NAME=${MUNINN_NAME:-}
    networks:
      - media-network
      - docker-api
      - muninn

  # Read-only Docker API for the panels that find containers by label (sleipnir, muninn), and only the
  # container list: no exec, no start, no images.
  # On its own internal network so nothing else here can reach it.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_SOCKET_PROXY_VERSION}
    container_name: docker-socket-proxy
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [docker-socket-proxy, vpn, bots, all]
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  # A tunnel to try the panel on: huginn lives in it and reports the exit it sees, so a switch can
  # be checked by eye. It must exit through a country other than the main tunnel's, since both use
  # the same WireGuard key and two sessions on one server drop each other.
  gluetun-test:
    image: qmcgaw/gluetun:${GLUETUN_VERSION}
    container_name: gluetun-test
    restart: unless-stopped
    profiles: [gluetun-test, vpn, all]
    labels:
      sleipnir.enable: "true"
      sleipnir.used-by: "huginn"
      sleipnir.probe: "http://gluetun-test:8080/json"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASS}
      - OPENVPN_PROTOCOL=${VPN_PROTOCOL}
      - SERVER_COUNTRIES=${VPN_TEST_COUNTRY:-Turkey}
      - FIREWALL_INPUT_PORTS=8080
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set GLUETUN_API_KEY in .env, see docs/sleipnir.md}"}'
      - UPDATER_PERIOD=24h
    volumes:
      - ${APP_CONFIG_PATH}/gluetun-test:/gluetun
    networks:
      - media-network

  huginn:
    image: ghcr.io/platanosverdes/sleipnir:${SLEIPNIR_VERSION}
    command: ["huginn"]
    container_name: huginn
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    profiles: [huginn, vpn, all]
    network_mode: "service:gluetun-test"
    depends_on:
      gluetun-test:
        condition: service_healthy

networks:
  media-network:
    external: true
  docker-api:
    internal: true
  # What muninn and the bots it watches share, and nothing else: a public bot (torre) joins it
  # without joining media-network. Named, so the bots' own compose files can attach to it.
  muninn:
    name: muninn
    internal: true
