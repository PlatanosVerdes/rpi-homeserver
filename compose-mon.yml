# --- MONITORING ---
services:
  # --- PUSHGATEWAY (Metrics receiver) ---
  pushgateway:
    image: prom/pushgateway:${PUSHGATEWAY_VERSION}
    container_name: pushgateway
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, acestream, all]
    # Persisted, or a restart wipes the one-shot job metrics (deploy, backup, cal-bridge). One
    # snapshot file rewritten every 5m, so it does not grow.
    command:
      - --persistence.file=/data/metrics
      - --persistence.interval=5m
    user: "65534:65534"
    ports:
      - "9091:9091"
    volumes:
      - ${APP_CONFIG_PATH}/pushgateway:/data
    networks:
      - media-network


  # --- NODE EXPORTER (Host metrics: CPU, RAM, disk, network) ---
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/textfile_collector:ro
      # The / bind mount is not recursive, so the data disk needs its own mount or the
      # filesystem collector cannot see it (no free-space metric for it, no disk-full alert)
      - ${DATA_ROOT}:/rootfs${DATA_ROOT}:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'

  # --- CADVISOR (Container metrics) ---
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION}
    container_name: cadvisor
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [moni, all]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      # disk/diskIO walk every container's filesystem on external storage each cycle, and
      # pi-metrics already covers that. referenced_memory reads /proc/<pid>/smaps
      # per process and logs a warning for each one it cannot read: 66 log lines per 80 s here, and
      # nothing graphs it. "accelerator" is not a metric kind in v0.60.5 and crash-loops the flag
      # parse, so do not add it.
      - --disable_metrics=advtcp,tcp,udp,percpu,sched,process,disk,diskIO,referenced_memory
    networks:
      - media-network

  # --- PROMETHEUS (TSDB database) ---
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    labels:
      prometheus.probe: "http://prometheus:9090/-/healthy"
    restart: unless-stopped
    profiles: [moni, acestream, all]
    user: "root"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${APP_CONFIG_PATH}/prometheus/data:/prometheus
      # Read-only, and only to list containers: the blackbox job takes its targets from the
      # `prometheus.probe` label instead of a list kept by hand (see config/prometheus/prometheus.yml)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - media-network


  # --- GRAFANA (Dashboard visual) ---
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    labels:
      prometheus.probe: "http://grafana:3000/"
    restart: unless-stopped
    profiles: [moni, acestream, all]
    user: "root"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    environment:
      # Without TZ, Go formats .StartsAt in UTC and every Telegram alert reads two hours early.
      - TZ=${TZ}
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      - GF_SECURITY_ADMIN_USER=admin
      # Only read when Grafana initialises its DB, so changing it here does nothing to an existing
      # install. Kept in .env so a rebuilt Pi does not come back as admin/admin.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # No Telegram vars here on purpose: the contact point is rendered before startup by
      # scripts/deploy/apply.sh, so the token never enters the container's environment.
      #
      # Every link in a notification is built from the root URL, and Telegram silently refuses to
      # linkify the default localhost one, which reads as a broken alert rather than a missing setting.
      - GF_SERVER_ROOT_URL=https://grafana.platanosverdes.com
    volumes:
      - ${APP_CONFIG_PATH}/grafana/data:/var/lib/grafana
      - ${CONFIG_ROOT}/grafana/provisioning:/etc/grafana/provisioning:ro
      # Alerting is rendered by scripts/deploy/apply.sh from config/grafana/alerting/ (the bot token
      # and chat id come from .env), so it is mounted over the empty dir above
      - ${APP_CONFIG_PATH}/grafana-alerting:/etc/grafana/provisioning/alerting:ro
      - ${CONFIG_ROOT}/grafana/dashboards_json:/etc/grafana/dashboards_json:ro
    networks:
      - media-network

  # --- BLACKBOX EXPORTER (is that service actually answering?) ---
  # cAdvisor says a container is running; this says it answers. Which containers, and at what URL,
  # comes from their own `prometheus.probe` label: see docs/add-service.md.
  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    container_name: blackbox-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - media-network

  # --- PI-METRICS (the numbers no exporter provides) ---
  # Was three cron scripts pushing to Pushgateway and writing node_exporter textfiles. Scraped
  # instead, so its death is visible: a pushed metric outlives the thing that pushed it.
  # Collects in the background and answers the last snapshot, see services/pi-metrics/main.py.
  pi-metrics:
    build: ./services/pi-metrics
    container_name: pi-metrics
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [moni, all]
    environment:
      - TZ=${TZ}
      # qBittorrent's AuthSubnetWhitelist does not cover the Docker bridge, so it logs in
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
    volumes:
      # The arrs' API keys live in their config.xml and nowhere else, so they are read rather than
      # duplicated into .env. Whole directories and not the single file: git and the apps replace
      # that file, and a single-file bind mount would keep pointing at the old inode.
      - ${APP_CONFIG_PATH}/radarr:/appdata/radarr:ro
      - ${APP_CONFIG_PATH}/sonarr:/appdata/sonarr:ro
      - ${APP_CONFIG_PATH}/prowlarr:/appdata/prowlarr:ro
      # Read-only, for the disk walk and for spotting downloads no torrent claims
      - ${DATA_ROOT}:/mnt/data:ro
    networks:
      - media-network

  # --- QBITTORRENT EXPORTER (torrent states, speeds, ratios) ---
  # The WebUI's AuthSubnetWhitelist covers localhost, the LAN and the tailnet, but not the Docker
  # bridge this container sits on, so it authenticates like any other client.
  qbittorrent-exporter:
    image: esanchezm/prometheus-qbittorrent-exporter@${QBIT_EXPORTER_DIGEST}
    container_name: qbittorrent-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    environment:
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=${QBIT_PASSWORD}
      - EXPORTER_PORT=17871
    networks:
      - media-network

  # --- PIHOLE EXPORTER (Pi-hole DNS/ad-block metrics → Prometheus) ---
  # Pi-hole v6 compatible exporter. Grafana dashboard ID: 21043
  pihole-exporter:
    image: amonacoos/pihole6_exporter@${PIHOLE_EXPORTER_DIGEST}
    container_name: pihole-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PIHOLE_HOST=host.docker.internal
      - PIHOLE_API_KEY=${PIHOLE_PASSWORD}
      - PIHOLE_SCHEME=http
      - PIHOLE_PORT=8081
    networks:
      - media-network

  # --- TAILSCALE METRICS (peer status → Prometheus) ---
  # Reads tailscaled's LocalAPI over the host socket (world-readable, no privileges needed) and is
  # scraped over media-network, so its death shows up as up{job="tailscale"} == 0.
  # TAILSCALE_API_KEY is optional and only fills tailscale_peer_is_exit_node. It is an API key, not
  # an auth key: https://login.tailscale.com/admin/settings/keys
  tailscale-metrics:
    build: ./services/tailscale-metrics
    container_name: tailscale-metrics
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [moni, all]
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    environment:
      - TZ=${TZ}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
    networks:
      - media-network

  # --- VICTORIALOGS (Log storage) ---
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_VERSION}
    container_name: victorialogs
    labels:
      prometheus.probe: "http://victorialogs:9428/"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    profiles: [moni, all]
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
      - -loggerFormat=json
    volumes:
      # On the data disk, never on the SD card: a log DB writes constantly and would wear it out
      - ${DATA_DB_ROOT}/victorialogs:/victoria-logs-data
    networks:
      - media-network

  # --- VECTOR (Ships container logs into VictoriaLogs) ---
  vector:
    image: timberio/vector:${VECTOR_VERSION}
    container_name: vector
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [moni, all]
    depends_on:
      - victorialogs
    volumes:
      - ${CONFIG_ROOT}/vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Read-only, to enumerate containers and follow their logs. Same access cAdvisor already has.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_CONFIG_PATH}/vector:/vector-data
      # The cron scripts write to files on the host, not to stdout, so the docker source above
      # cannot see them. Each repo root and not a glob, because a bind mount cannot take one: that
      # does mean this container can read each .env, a smaller exposure than the docker socket it
      # already has. The companion repo arrives by EXT_LOGS_PATH, like its Caddy routes.
      - ./:/host-logs/homeserver:ro
      - ${EXT_LOGS_PATH:-./config/vector/ext-logs}:/host-logs/services:ro
    networks:
      - media-network

networks:
  media-network:
    external: true
