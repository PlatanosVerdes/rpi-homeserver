# --- MONITORING ---
services:
  # --- PUSHGATEWAY (Metrics receiver) ---
  pushgateway:
    image: prom/pushgateway:${PUSHGATEWAY_VERSION}
    container_name: pushgateway
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [pushgateway, moni, acestream, all]
    # Persisted, or a restart wipes the one-shot job metrics (deploy, backup). One
    # snapshot file rewritten every 5m, so it does not grow.
    command:
      - --persistence.file=/data/metrics
      - --persistence.interval=5m
    user: "65534:65534"
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ${APP_CONFIG_PATH}/pushgateway:/data
    networks:
      - media-network


  # --- NODE EXPORTER (Host metrics: CPU, RAM, disk, network) ---
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    labels:
      host.ports: "9100/tcp"
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [node-exporter, moni, all]
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/textfile_collector:ro
      # The / bind mount is not recursive, so the data disk needs its own mount or the
      # filesystem collector cannot see it (no free-space metric for it, no disk-full alert)
      - ${DATA_ROOT}:/rootfs${DATA_ROOT}:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'

  # --- CADVISOR (Container metrics) ---
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION}
    container_name: cadvisor
    # The image's wget healthcheck leaves zombies: cadvisor runs as PID 1 and never reaps them.
    init: true
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [cadvisor, moni, all]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      # disk/diskIO walk every container's filesystem on external storage each cycle, and
      # pi-metrics already covers that. referenced_memory reads /proc/<pid>/smaps
      # per process and logs a warning for each one it cannot read: 66 log lines per 80 s here, and
      # nothing graphs it. "accelerator" is not a metric kind in v0.60.5 and crash-loops the flag
      # parse, so do not add it. The list replaces cadvisor's default one, so the kinds it
      # disables by default (cpu_topology, cpuset, hugetlb, memory_numa, resctrl) must stay here.
      - --disable_metrics=advtcp,tcp,udp,percpu,sched,process,disk,diskIO,referenced_memory,cpu_topology,cpuset,hugetlb,memory_numa,resctrl
      # Only the labels the service-probes dashboard filters on, not every label on every series.
      - --store_container_labels=false
      - --whitelisted_container_labels=prometheus.probe,com.docker.compose.oneoff
    networks:
      - media-network

  # --- PROMETHEUS (TSDB database) ---
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    labels:
      prometheus.probe: "http://prometheus:9090/-/healthy"
    restart: unless-stopped
    profiles: [prometheus, moni, acestream, all]
    user: "root"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${APP_CONFIG_PATH}/prometheus/data:/prometheus
      # Read-only, and only to list containers: the blackbox job takes its targets from the
      # `prometheus.probe` label instead of a list kept by hand (see config/prometheus/prometheus.yml)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - media-network


  # --- GRAFANA (Dashboard visual) ---
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    labels:
      prometheus.probe: "http://grafana:3000/"
    restart: unless-stopped
    profiles: [grafana, moni, acestream, all]
    user: "root"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Without TZ, Go formats .StartsAt in UTC and every Telegram alert reads two hours early.
      - TZ=${TZ}
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      # Four outbound calls on every page load by default: usage stats, the version check, one
      # per plugin, and the news feed. On this line, where TLS to some Cloudflare ranges is
      # intercepted during the football blocking windows, they stall until they time out and the
      # dashboard waits with them. Measured 2026-08-25: Grafana itself serves /login in 25 ms and
      # Prometheus answers an instant query in 100 ms, so the wait was never local.
      # SQLite in its default journal mode locks the whole file for a write, and this one is on the
      # SD card with 36 alert rules evaluating every minute. Measured 2026-08-25: 32 "database is
      # locked (SQLITE_BUSY)" errors in 24 hours, each one an alert rule that failed to evaluate or
      # a datasource lookup that failed. Silent, because execErrState is KeepLast everywhere on
      # purpose. WAL lets readers and the writer coexist, which is the whole fix.
      #
      # This variable is not enough on its own, and that was measured too. Grafana logs
      # `Config overridden from Environment variable var="GF_DATABASE_WAL=true"` and its code adds
      # `_journal_mode=WAL` to the DSN, but 13.1.2 uses the pure-Go modernc driver and the existing
      # database stayed in `delete` across a restart. It was converted by hand on 2026-08-25, with
      # the container stopped, and the mode lives in the file so it survives from here:
      #
      #   docker stop grafana
      #   sudo python3 -c "import sqlite3;c=sqlite3.connect('APPDATA/grafana/data/grafana.db');\
      #       print(c.execute('pragma journal_mode=WAL').fetchone())"
      #   docker start grafana
      #
      # A rebuilt Pi starts from an empty database, so check it there rather than assuming:
      #   pragma journal_mode  should say wal, and grafana.db-wal should exist beside it.
      # And the count that matters, which should stay at zero:
      #   docker logs grafana | grep -c "database is locked"
      - GF_DATABASE_WAL=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      # Only read when Grafana initialises its DB, so changing it here does nothing to an existing
      # install. Kept in .env so a rebuilt Pi does not come back as admin/admin.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # No Telegram vars here on purpose: the contact point is rendered before startup by
      # scripts/deploy/apply.sh, so the token never enters the container's environment.
      #
      # Every link in a notification is built from the root URL, and Telegram silently refuses to
      # linkify the default localhost one, which reads as a broken alert rather than a missing setting.
      - GF_SERVER_ROOT_URL=https://grafana.platanosverdes.com
      # The local Prometheus datasource's name, which is what a Node selector shows next to a
      # companion repo's datasources. Renaming an existing install needs the row renamed first:
      # provisioning matches by name and refuses a second datasource with the same uid.
      - GRAFANA_PROMETHEUS_NAME=${GRAFANA_PROMETHEUS_NAME:-Prometheus}
      # Behind Cloudflare Access, users sign in with whatever Access accepts (Google): Grafana
      # reads the token Access adds to every request, creates the user on first visit and gives
      # it Viewer, or GrafanaAdmin to GRAFANA_ADMIN_EMAIL. Without the header (the tailnet, through
      # Caddy) the login form still works, so admin/password stays the way in when Cloudflare is not.
      - GF_AUTH_JWT_ENABLED=${GRAFANA_ACCESS_JWT:-false}
      - GF_AUTH_JWT_HEADER_NAME=Cf-Access-Jwt-Assertion
      - GF_AUTH_JWT_EMAIL_CLAIM=email
      - GF_AUTH_JWT_USERNAME_CLAIM=email
      - GF_AUTH_JWT_JWK_SET_URL=https://${CF_ACCESS_TEAM_DOMAIN:-unset.cloudflareaccess.com}/cdn-cgi/access/certs
      - 'GF_AUTH_JWT_EXPECT_CLAIMS={"aud":["${GRAFANA_ACCESS_AUD:-unset}"],"iss":"https://${CF_ACCESS_TEAM_DOMAIN:-unset.cloudflareaccess.com}"}'
      - GF_AUTH_JWT_AUTO_SIGN_UP=true
      - GF_AUTH_JWT_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - "GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH=contains(['${GRAFANA_ADMIN_EMAIL:-}'], email) && 'GrafanaAdmin' || 'Viewer'"
    volumes:
      - ${APP_CONFIG_PATH}/grafana/data:/var/lib/grafana
      - ${CONFIG_ROOT}/grafana/provisioning:/etc/grafana/provisioning:ro
      # Datasources from a companion repo (EXT_GRAFANA_DATASOURCES in .env, a file), e.g. another
      # node's Prometheus; without it the empty placeholder is mounted over itself.
      - ${EXT_GRAFANA_DATASOURCES:-./config/grafana/provisioning/datasources/ext.yml}:/etc/grafana/provisioning/datasources/ext.yml:ro
      # Alerting is rendered by scripts/deploy/apply.sh from config/grafana/alerting/ (the bot token
      # and chat id come from .env), so it is mounted over the empty dir above
      - ${APP_CONFIG_PATH}/grafana-alerting:/etc/grafana/provisioning/alerting:ro
      - ${CONFIG_ROOT}/grafana/dashboards_json:/etc/grafana/dashboards_json:ro
      # A companion repo's dashboards (EXT_GRAFANA_DASHBOARDS, a folder); unset, the empty one.
      - ${EXT_GRAFANA_DASHBOARDS:-./config/grafana/dashboards_ext}:/etc/grafana/dashboards_ext:ro
    networks:
      - media-network

  # --- BLACKBOX EXPORTER (is that service actually answering?) ---
  # cAdvisor says a container is running; this says it answers. Which containers, and at what URL,
  # comes from their own `prometheus.probe` label: see docs/add-service.md.
  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    container_name: blackbox-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [blackbox-exporter, moni, all]
    # Public resolvers, not Pi-hole: a public URL has to be probed the way the internet reaches it,
    # and Pi-hole answers *.platanosverdes.com with the tailnet door instead. Container names still
    # resolve through Docker's own DNS, which only forwards the rest here.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - media-network

  # --- SMOKEPING PROBER (latency and packet loss to the internet, continuously) ---
  # One ping a second to each target, kept as histograms: what speedtest's four tests a day miss.
  # Two providers, so a dead line (both fail) reads differently from one provider's trouble.
  smokeping-prober:
    image: quay.io/superq/smokeping-prober:${SMOKEPING_PROBER_VERSION}
    container_name: smokeping-prober
    labels:
      prometheus.probe: "http://smokeping-prober:9374/-/healthy"
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    cpu_shares: 128
    profiles: [smokeping-prober, moni, all]
    # Unprivileged ICMP, which Docker's default ping_group_range allows; no --privileged needed.
    command: ["1.1.1.1", "8.8.8.8"]
    environment:
      - GOMAXPROCS=1
    networks:
      - media-network

  # --- PI-METRICS (the numbers no exporter provides) ---
  # Was three cron scripts pushing to Pushgateway and writing node_exporter textfiles. Scraped
  # instead, so its death is visible: a pushed metric outlives the thing that pushed it.
  # Collects in the background and answers the last snapshot, see services/pi-metrics/main.py.
  pi-metrics:
    # Built by CI and pulled; build: is only the fallback, see docs/service-images.md.
    image: ghcr.io/platanosverdes/rpi-homeserver-pi-metrics:${PI_METRICS_IMAGE_TAG}
    build: ./services/pi-metrics
    container_name: pi-metrics
    restart: unless-stopped
    # The hourly disk walk holds every file of /mnt/data in a map. At 64m it sat at the limit: 294k
    # hits and 8.5M pages re-read in a day and a half, with its API calls timing out meanwhile.
    mem_limit: 192m
    memswap_limit: 192m
    profiles: [pi-metrics, moni, all]
    # Plex runs on the host network, so the playback collector reaches it through the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ}
      # qBittorrent's AuthSubnetWhitelist does not cover the Docker bridge, so it logs in
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      # Which sessions each media server is re-encoding. Unlike the arrs, neither keeps its key in a
      # config.xml this container could read, and leaving one empty simply drops that server from
      # the collector rather than failing it.
      - PLEX_API_TOKEN=${PLEX_API_TOKEN:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - JELLYFIN_URL=http://host.docker.internal:8096
    volumes:
      # The arrs' API keys live in their config.xml and nowhere else, so they are read rather than
      # duplicated into .env. Whole directories and not the single file: git and the apps replace
      # that file, and a single-file bind mount would keep pointing at the old inode.
      - ${APP_CONFIG_PATH}/radarr:/appdata/radarr:ro
      - ${APP_CONFIG_PATH}/sonarr:/appdata/sonarr:ro
      - ${APP_CONFIG_PATH}/prowlarr:/appdata/prowlarr:ro
      # Read-only, for the disk walk and for spotting downloads no torrent claims
      - ${DATA_ROOT}:/mnt/data:ro
      # The only thing it writes: what qbit-manage posted after its last run, so a restart of this
      # container does not read as "qbit-manage has not run" until the next hour; and which audio
      # codecs clients had re-encoded, which scripts/sync/audio-compat.py reads from the host.
      - ${APP_CONFIG_PATH}/pi-metrics:/state
      # Read-only. Plex's sessions never say whether the client asked for direct play, and only that
      # separates "this codec is unsupported" from "the client gave up on direct play" (cause.go).
      - "${APP_CONFIG_PATH}/plex/Library/Application Support/Plex Media Server/Logs:/plex-logs:ro"
    networks:
      - media-network

  # --- QBITTORRENT EXPORTER (torrent states, speeds, ratios) ---
  # The WebUI's AuthSubnetWhitelist covers localhost, the LAN and the tailnet, but not the Docker
  # bridge this container sits on, so it authenticates like any other client.
  qbittorrent-exporter:
    image: esanchezm/prometheus-qbittorrent-exporter@${QBIT_EXPORTER_DIGEST}
    container_name: qbittorrent-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [qbittorrent-exporter, moni, all]
    environment:
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=${QBIT_PASSWORD}
      - EXPORTER_PORT=17871
    networks:
      - media-network

  # --- PIHOLE EXPORTER (Pi-hole DNS/ad-block metrics → Prometheus) ---
  # Pi-hole v6 compatible exporter. Grafana dashboard ID: 21043
  pihole-exporter:
    image: amonacoos/pihole6_exporter@${PIHOLE_EXPORTER_DIGEST}
    container_name: pihole-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [pihole-exporter, moni, all]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PIHOLE_HOST=host.docker.internal
      - PIHOLE_API_KEY=${PIHOLE_PASSWORD}
      - PIHOLE_SCHEME=http
      - PIHOLE_PORT=8081
    networks:
      - media-network

  # --- TAILSCALE METRICS (peer status → Prometheus) ---
  # Reads tailscaled's LocalAPI over the host socket (world-readable, no privileges needed) and is
  # scraped over media-network, so its death shows up as up{job="tailscale"} == 0.
  # TAILSCALE_API_KEY is optional and only fills tailscale_peer_is_exit_node. It is an API key, not
  # an auth key: https://login.tailscale.com/admin/settings/keys
  tailscale-metrics:
    image: ghcr.io/platanosverdes/rpi-homeserver-tailscale-metrics:${TAILSCALE_METRICS_IMAGE_TAG}
    build: ./services/tailscale-metrics
    container_name: tailscale-metrics
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [tailscale-metrics, moni, all]
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    environment:
      - TZ=${TZ}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
    networks:
      - media-network

  # --- VICTORIALOGS (Log storage) ---
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_VERSION}
    container_name: victorialogs
    labels:
      prometheus.probe: "http://victorialogs:9428/"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    profiles: [victorialogs, moni, all]
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
      - -loggerFormat=json
    volumes:
      # On the data disk, never on the SD card: a log DB writes constantly and would wear it out
      - ${DATA_DB_ROOT}/victorialogs:/victoria-logs-data
    networks:
      - media-network

  # --- VECTOR (Ships container logs into VictoriaLogs) ---
  vector:
    image: timberio/vector:${VECTOR_VERSION}
    container_name: vector
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [vector, moni, all]
    depends_on:
      - victorialogs
    volumes:
      - ${CONFIG_ROOT}/vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Read-only, to enumerate containers and follow their logs. Same access cAdvisor already has.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_CONFIG_PATH}/vector:/vector-data
      # The cron scripts write to files on the host, not to stdout, so the docker source above
      # cannot see them. Each repo root and not a glob, because a bind mount cannot take one: that
      # does mean this container can read each .env, a smaller exposure than the docker socket it
      # already has. The companion repo arrives by EXT_LOGS_PATH, like its Caddy routes.
      - ./:/host-logs/homeserver:ro
      - ${EXT_LOGS_PATH:-./config/vector/ext-logs}:/host-logs/services:ro
    networks:
      - media-network

networks:
  media-network:
    external: true
