# --- MONITORING ---
services:
  # --- PUSHGATEWAY (Metrics receiver) ---
  pushgateway:
    image: prom/pushgateway:${PUSHGATEWAY_VERSION}
    container_name: pushgateway
    restart: unless-stopped
    profiles: [moni, acestream, all]
    # Persist pushed metrics to disk so a restart does not wipe one-shot/daily job metrics
    # (deploy, backup, one-pace, cal-bridge). Single snapshot file, rewritten every 5m — no growth.
    command:
      - --persistence.file=/data/metrics
      - --persistence.interval=5m
    user: "65534:65534"
    ports:
      - "9091:9091"
    volumes:
      - ${APP_CONFIG_PATH}/pushgateway:/data
    networks:
      - media-network


  # --- NODE EXPORTER (Host metrics: CPU, RAM, disk, network) ---
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    restart: unless-stopped
    profiles: [moni, all]
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/textfile_collector:ro
      # The / bind mount is not recursive, so the data disk needs its own mount or the
      # filesystem collector cannot see it (no free-space metric for it, no disk-full alert)
      - ${DATA_ROOT}:/rootfs${DATA_ROOT}:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'

  # --- CADVISOR (Container metrics) ---
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION}
    container_name: cadvisor
    restart: unless-stopped
    profiles: [moni, all]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=advtcp,tcp,udp,percpu,sched,process
    networks:
      - media-network

  # --- PROMETHEUS (TSDB database) ---
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: unless-stopped
    profiles: [moni, acestream, all]
    user: "root"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${APP_CONFIG_PATH}/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - media-network


  # --- GRAFANA (Dashboard visual) ---
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    profiles: [moni, acestream, all]
    user: "root"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Only applied when Grafana initialises its DB for the first time, so changing it here does
      # not change an existing install's password. Keep it in .env so a rebuilt Pi does not
      # silently come back up as admin/admin.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # No Telegram vars here on purpose: the contact point is rendered before startup by
      # apply.sh, so the token never enters the container's environment
    volumes:
      - ${APP_CONFIG_PATH}/grafana/data:/var/lib/grafana
      - ${CONFIG_ROOT}/grafana/provisioning:/etc/grafana/provisioning:ro
      # Alerting is rendered by apply.sh from config/grafana/alerting/ (the bot token
      # and chat id come from .env), so it is mounted over the empty dir above
      - ${APP_CONFIG_PATH}/grafana-alerting:/etc/grafana/provisioning/alerting:ro
      - ${CONFIG_ROOT}/grafana/dashboards_json:/etc/grafana/dashboards_json:ro
    networks:
      - media-network

  # --- BLACKBOX EXPORTER (is that service actually answering?) ---
  # cAdvisor says a container is running; this says it responds. Covers the services with no
  # exporter of their own (Plex, Jellyfin, the *arrs, qBittorrent). Targets live in
  # config/prometheus/prometheus.yml.
  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    container_name: blackbox-exporter
    restart: unless-stopped
    profiles: [moni, all]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - media-network

  # --- QBITTORRENT EXPORTER (torrent states, speeds, ratios) ---
  # The WebUI's AuthSubnetWhitelist covers localhost, the LAN and the tailnet, but not the Docker
  # bridge this container sits on, so it authenticates like any other client.
  qbittorrent-exporter:
    image: esanchezm/prometheus-qbittorrent-exporter@${QBIT_EXPORTER_DIGEST}
    container_name: qbittorrent-exporter
    restart: unless-stopped
    profiles: [moni, all]
    environment:
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=${QBIT_PASSWORD}
      - EXPORTER_PORT=17871
    networks:
      - media-network

  # --- PIHOLE EXPORTER (Pi-hole DNS/ad-block metrics → Prometheus) ---
  # Pi-hole v6 compatible exporter. Grafana dashboard ID: 21043
  pihole-exporter:
    image: amonacoos/pihole6_exporter@${PIHOLE_EXPORTER_DIGEST}
    container_name: pihole-exporter
    restart: unless-stopped
    profiles: [moni, all]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PIHOLE_HOST=host.docker.internal
      - PIHOLE_API_KEY=${PIHOLE_PASSWORD}
      - PIHOLE_SCHEME=http
      - PIHOLE_PORT=8081
    networks:
      - media-network

  # --- TAILSCALE EXPORTER (Tailscale device status → Prometheus) ---
  # Shows all devices in the "Bannet" tailnet: online/offline, IP, OS, last seen.
  # Requires a Tailscale API key (NOT the auth key):
  #   → https://login.tailscale.com/admin/settings/keys → "Generate API key"
  # Add TAILSCALE_API_KEY to .env, then uncomment this service.
  # Grafana dashboard ID: 17722
  #
  # tailscale-exporter:
  #   image: ghcr.io/maauso/tailscale-exporter:latest
  #   container_name: tailscale-exporter
  #   restart: unless-stopped
  #   profiles: [moni, all]
  #   environment:
  #     - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
  #     - TAILSCALE_TAILNET=-          # "-" = default tailnet for the API key owner
  #   ports:
  #     - "9736:9736"
  #   networks:
  #     - media-network

networks:
  media-network:
    external: true
