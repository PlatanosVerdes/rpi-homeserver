# --- MONITORING ---
services:
  # --- PUSHGATEWAY (Metrics receiver) ---
  pushgateway:
    image: prom/pushgateway:${PUSHGATEWAY_VERSION}
    container_name: pushgateway
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, acestream, all]
    # Persist pushed metrics to disk so a restart does not wipe one-shot/daily job metrics
    # (deploy, backup, one-pace, cal-bridge). Single snapshot file, rewritten every 5m — no growth.
    command:
      - --persistence.file=/data/metrics
      - --persistence.interval=5m
    user: "65534:65534"
    ports:
      - "9091:9091"
    volumes:
      - ${APP_CONFIG_PATH}/pushgateway:/data
    networks:
      - media-network


  # --- NODE EXPORTER (Host metrics: CPU, RAM, disk, network) ---
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/textfile_collector:ro
      # The / bind mount is not recursive, so the data disk needs its own mount or the
      # filesystem collector cannot see it (no free-space metric for it, no disk-full alert)
      - ${DATA_ROOT}:/rootfs${DATA_ROOT}:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'

  # --- CADVISOR (Container metrics) ---
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION}
    container_name: cadvisor
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [moni, all]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      # disk/diskIO are the expensive ones (each housekeeping cycle walks every container's
      # filesystem on external/mergerfs storage); we already track disk usage separately via
      # scripts/metrics/disk-usage.sh, so cAdvisor's own per-container copy of that isn't needed.
      # "accelerator" doesn't exist as a metric kind in v0.60.5 (unlike newer cAdvisor releases)
      # and made the flag parse fail outright, crash-looping the whole container.
      #
      # referenced_memory is the reason cAdvisor was the loudest thing on the server: collecting it
      # means reading /proc/<pid>/smaps for every process in every container, and each one that
      # cannot be read logs a warning. That was 66 lines per 80 seconds against 1 for everything
      # else, ~72k a day, all of it now kept for 30 days in VictoriaLogs. Nothing here graphs the
      # metric. Measured A/B on this Pi before committing: 0 warnings with the flag, 66 without.
      - --disable_metrics=advtcp,tcp,udp,percpu,sched,process,disk,diskIO,referenced_memory
    networks:
      - media-network

  # --- PROMETHEUS (TSDB database) ---
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: unless-stopped
    profiles: [moni, acestream, all]
    user: "root"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${APP_CONFIG_PATH}/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - media-network


  # --- GRAFANA (Dashboard visual) ---
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    profiles: [moni, acestream, all]
    user: "root"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    environment:
      # Without TZ, Go formats alert timestamps in UTC and every Telegram message reads two
      # hours early. Alert bodies print .StartsAt, so this is not cosmetic.
      - TZ=${TZ}
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      - GF_SECURITY_ADMIN_USER=admin
      # Only applied when Grafana initialises its DB for the first time, so changing it here does
      # not change an existing install's password. Keep it in .env so a rebuilt Pi does not
      # silently come back up as admin/admin.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # No Telegram vars here on purpose: the contact point is rendered before startup by
      # scripts/deploy/apply.sh, so the token never enters the container's environment
      #
      # Every link Grafana puts in a notification is built from this. Without it the default is
      # http://localhost:3000, and Telegram silently refuses to linkify a localhost URL: the
      # "Silence this" line arrived as plain text with no entity, which reads like a broken alert
      # rather than a missing setting.
      - GF_SERVER_ROOT_URL=https://grafana.platanosverdes.com
    volumes:
      - ${APP_CONFIG_PATH}/grafana/data:/var/lib/grafana
      - ${CONFIG_ROOT}/grafana/provisioning:/etc/grafana/provisioning:ro
      # Alerting is rendered by scripts/deploy/apply.sh from config/grafana/alerting/ (the bot token
      # and chat id come from .env), so it is mounted over the empty dir above
      - ${APP_CONFIG_PATH}/grafana-alerting:/etc/grafana/provisioning/alerting:ro
      - ${CONFIG_ROOT}/grafana/dashboards_json:/etc/grafana/dashboards_json:ro
    networks:
      - media-network

  # --- BLACKBOX EXPORTER (is that service actually answering?) ---
  # cAdvisor says a container is running; this says it responds. Covers the services with no
  # exporter of their own (Plex, Jellyfin, the *arrs, qBittorrent). Targets live in
  # config/prometheus/prometheus.yml.
  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    container_name: blackbox-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT}/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - media-network

  # --- QBITTORRENT EXPORTER (torrent states, speeds, ratios) ---
  # The WebUI's AuthSubnetWhitelist covers localhost, the LAN and the tailnet, but not the Docker
  # bridge this container sits on, so it authenticates like any other client.
  qbittorrent-exporter:
    image: esanchezm/prometheus-qbittorrent-exporter@${QBIT_EXPORTER_DIGEST}
    container_name: qbittorrent-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    environment:
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=${QBIT_PASSWORD}
      - EXPORTER_PORT=17871
    networks:
      - media-network

  # --- PIHOLE EXPORTER (Pi-hole DNS/ad-block metrics → Prometheus) ---
  # Pi-hole v6 compatible exporter. Grafana dashboard ID: 21043
  pihole-exporter:
    image: amonacoos/pihole6_exporter@${PIHOLE_EXPORTER_DIGEST}
    container_name: pihole-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [moni, all]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PIHOLE_HOST=host.docker.internal
      - PIHOLE_API_KEY=${PIHOLE_PASSWORD}
      - PIHOLE_SCHEME=http
      - PIHOLE_PORT=8081
    networks:
      - media-network

  # --- TAILSCALE METRICS (peer status → Prometheus) ---
  # Was a Go binary compiled by hand and run from cron every minute, writing into
  # node-exporter's textfile collector. Nothing in git built it, so a rebuilt Pi lost the
  # nine panels of the Tailscale dashboard in silence. Now it is built by compose like every
  # other service here, and its death shows up as up{job="tailscale"} == 0.
  #
  # It reads tailscaled's LocalAPI over the host socket (world-readable, no privileges needed).
  # TAILSCALE_API_KEY is optional and only fills tailscale_peer_is_exit_node: without it every
  # other metric still works. It is an API key, not an auth key:
  #   https://login.tailscale.com/admin/settings/keys
  #
  # No published port: Prometheus scrapes it over media-network.
  tailscale-metrics:
    build: ./services/tailscale-metrics
    container_name: tailscale-metrics
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    profiles: [moni, all]
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    environment:
      - TZ=${TZ}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
    networks:
      - media-network

  # --- VICTORIALOGS (Log storage) ---
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_VERSION}
    container_name: victorialogs
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    profiles: [moni, all]
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
      - -loggerFormat=json
    volumes:
      # On the data disk, never on the SD card: a log DB writes constantly and would wear it out
      - ${DATA_DB_ROOT}/victorialogs:/victoria-logs-data
    networks:
      - media-network

  # --- VECTOR (Ships container logs into VictoriaLogs) ---
  vector:
    image: timberio/vector:${VECTOR_VERSION}
    container_name: vector
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [moni, all]
    depends_on:
      - victorialogs
    volumes:
      - ${CONFIG_ROOT}/vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Read-only, and only to enumerate containers and follow their logs. Same access cAdvisor
      # and Homepage already have, so it grants nothing new on this host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_CONFIG_PATH}/vector:/vector-data
      # The cron scripts write to files on the host, not to a container's stdout, so the docker
      # source above cannot see them: deploys, backups and the nightly search were the one part of
      # this server's history that stayed out of the log store.
      #
      # Each repo root, because the .log files sit loose in them and a bind mount cannot take a
      # glob. Read-only, and vector.yaml only ever opens *.log — but it does mean this container
      # can see each .env. That is a smaller exposure than the docker socket it already mounts,
      # which is root-equivalent on this host; moving the logs into their own directory would
      # remove it, at the cost of touching every cron line and the logrotate rule.
      #
      # The companion repo arrives by EXT_LOGS_PATH, the same way its Caddy routes arrive by
      # EXT_CADDY_PATH: this repo never learns where the other one lives, and mounts an empty
      # tracked directory when there is no companion at all.
      - ./:/host-logs/homeserver:ro
      - ${EXT_LOGS_PATH:-./config/vector/ext-logs}:/host-logs/services:ro
    networks:
      - media-network

networks:
  media-network:
    external: true
